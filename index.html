<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>暑假学习计划</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', 'SF Pro Display', 'SF Pro Text', 'Segoe UI', 'Roboto', 'system-ui', 'sans-serif'],
                    },
                    colors: {
                        apple: {
                            blue: '#007AFF',
                            indigo: '#5856D6',
                            purple: '#AF52DE',
                            pink: '#FF2D55',
                            red: '#FF3B30',
                            orange: '#FF9500',
                            yellow: '#FFCC00',
                            green: '#34C759',
                            teal: '#5AC8FA',
                            gray: '#8E8E93',
                            bg: '#F5F5F7',
                            card: 'rgba(255, 255, 255, 0.72)',
                            cardDark: 'rgba(28, 28, 30, 0.72)',
                        }
                    },
                    boxShadow: {
                        'apple': '0 4px 24px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.02)',
                        'apple-lg': '0 12px 48px rgba(0, 0, 0, 0.08), 0 4px 12px rgba(0, 0, 0, 0.04)',
                        'glow': '0 0 40px rgba(0, 122, 255, 0.15)',
                    },
                    borderRadius: {
                        'apple': '1.25rem',
                        'apple-xl': '1.5rem',
                    }
                },
            },
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        * {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI', Roboto, system-ui, sans-serif;
            transition: background 0.5s ease;
        }
        
        /* 动态背景层 */
        #bgLayer {
            position: fixed;
            inset: 0;
            z-index: -1;
            transition: all 0.5s ease;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        
        #bgLayer::before {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--bg-overlay, rgba(255,255,255,0));
            transition: all 0.5s ease;
        }
        
        /* 苹果风格玻璃拟态 */
        .glass {
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        
        .dark .glass {
            background: rgba(28, 28, 30, 0.72);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.42);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.02);
        }
        
        .dark .glass-card {
            background: rgba(28, 28, 30, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.2), 0 1px 2px rgba(0, 0, 0, 0.1);
        }
        
        /* 自定义滚动条 */
        .custom-scrollbar::-webkit-scrollbar { width: 8px; height: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.12); border-radius: 100px; border: 2px solid transparent; background-clip: padding-box; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(0, 0, 0, 0.2); }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.25); }
        
        /* 输入框焦点 */
        .input-apple {
            transition: all 0.2s cubic-bezier(0.25, 0.1, 0.25, 1);
        }
        .input-apple:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.12);
            border-color: rgba(0, 122, 255, 0.4);
        }
        .dark .input-apple:focus {
            background: rgba(44, 44, 46, 0.9);
            box-shadow: 0 0 0 4px rgba(10, 132, 255, 0.18);
        }
        
        /* 按钮按压效果 */
        .btn-apple {
            transition: all 0.15s cubic-bezier(0.25, 0.1, 0.25, 1);
        }
        .btn-apple:active {
            transform: scale(0.96);
        }
        
        /* 勾选动画 */
        .check-circle { transition: all 0.25s cubic-bezier(0.25, 0.1, 0.25, 1); }
        .check-circle.checked {
            background: linear-gradient(135deg, #007AFF 0%, #00C6FF 100%);
            border-color: transparent;
        }
        .dark .check-circle.checked {
            background: linear-gradient(135deg, #0A84FF 0%, #64D2FF 100%);
        }
        
        /* 卡片入场动画 */
        .fade-in { animation: fadeIn 0.5s cubic-bezier(0.25, 0.1, 0.25, 1) forwards; }
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(16px) scale(0.98); } 
            to { opacity: 1; transform: translateY(0) scale(1); } 
        }
        
        /* 背景预设 */
        .bg-preset-default { background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%); }
        .bg-preset-ocean { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .bg-preset-sunset { background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); }
        .bg-preset-forest { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); }
        .bg-preset-midnight { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); }
        .bg-preset-sky { background: linear-gradient(135deg, #89f7fe 0%, #66a6ff 100%); }
        .bg-preset-candy { background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%); }
        .bg-preset-dark { background: #000000; }
        
        /* 背景选择器 */
        .bg-option {
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .bg-option:hover { transform: scale(1.08); }
        .bg-option.active { box-shadow: 0 0 0 3px #007AFF; transform: scale(1.08); }
        
        /* 表格样式 */
        .schedule-table th, .schedule-table td {
            border: none;
        }
        .schedule-table tbody tr {
            transition: background 0.2s ease;
        }
        .schedule-table tbody tr:hover {
            background: rgba(0, 0, 0, 0.02);
        }
        .dark .schedule-table tbody tr:hover {
            background: rgba(255, 255, 255, 0.04);
        }
        
        /* 导航模糊 */
        .nav-glass {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.4);
        }
        .dark .nav-glass {
            background: rgba(28, 28, 30, 0.65);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        
        /* 浮动背景设置面板 */
        .settings-panel {
            transform: translateY(10px);
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
        }
        .settings-panel.open {
            transform: translateY(0);
            opacity: 1;
            pointer-events: auto;
        }
        
        /* Toast */
        .toast-apple {
            background: rgba(0, 0, 0, 0.72);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
    </style>
</head>
<body class="text-gray-800 dark:text-gray-100 min-h-screen">
    <!-- 动态背景层 -->
    <div id="bgLayer" class="bg-preset-default"></div>
    
    <div class="min-h-screen flex flex-col relative">
        <!-- 顶部导航 -->
        <header class="sticky top-0 z-50 nav-glass">
            <div class="max-w-6xl mx-auto px-4 sm:px-6 py-3.5 flex items-center justify-between">
                <div class="flex items-center gap-3.5 cursor-pointer" id="planSwitcher">
                    <div class="w-11 h-11 rounded-apple-xl bg-gradient-to-br from-apple-blue to-cyan-400 flex items-center justify-center text-white shadow-glow">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                        </svg>
                    </div>
                    <div>
                        <h1 class="text-lg font-semibold tracking-tight text-gray-900 dark:text-white" id="currentPlanName">暑假计划</h1>
                        <p class="text-xs text-gray-500 dark:text-gray-400 font-medium">粘贴导入 · 自动保存 · Excel导出</p>
                    </div>
                    <svg class="w-4 h-4 text-gray-400 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                    </svg>
                </div>
                <div class="flex items-center gap-2 sm:gap-3">
                    <span id="saveStatus" class="text-xs text-gray-500 dark:text-gray-400 font-medium items-center gap-1.5 hidden sm:flex">
                        <span class="w-1.5 h-1.5 rounded-full bg-apple-green"></span>
                        已保存
                    </span>
                    <button id="pasteBtn" class="btn-apple px-4 py-2 text-sm font-medium text-white bg-apple-blue hover:bg-blue-600 rounded-xl shadow-apple flex items-center gap-1.5">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
                        </svg>
                        <span class="hidden sm:inline">粘贴导入</span>
                    </button>
                    <button id="exportBtn" class="btn-apple px-4 py-2 text-sm font-medium text-gray-700 dark:text-gray-200 bg-white/80 dark:bg-white/10 hover:bg-white dark:hover:bg-white/20 rounded-xl shadow-apple border border-white/50 dark:border-white/10 flex items-center gap-1.5">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                        </svg>
                        <span class="hidden sm:inline">导出Excel</span>
                    </button>
                    <button id="bgSettingsBtn" class="btn-apple px-3 py-2 text-sm font-medium text-gray-700 dark:text-gray-200 bg-white/80 dark:bg-white/10 hover:bg-white dark:hover:bg-white/20 rounded-xl shadow-apple border border-white/50 dark:border-white/10" title="自定义背景">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                        </svg>
                    </button>
                    <button id="clearBtn" class="btn-apple px-3 py-2 text-sm font-medium text-gray-700 dark:text-gray-200 bg-white/80 dark:bg-white/10 hover:bg-red-50 hover:text-red-500 dark:hover:bg-red-500/20 dark:hover:text-red-400 rounded-xl shadow-apple border border-white/50 dark:border-white/10" title="清空内容">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </header>

        <!-- 主内容区 -->
        <main class="flex-1 overflow-y-auto custom-scrollbar p-4 sm:p-6 lg:p-8">
            <div class="max-w-6xl mx-auto space-y-6">
                <!-- 阶段目标 -->
                <div class="glass-card rounded-apple-xl p-6 fade-in" style="animation-delay: 0ms;">
                    <div class="flex items-center gap-3 mb-4">
                        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-amber-400 to-orange-500 flex items-center justify-center text-white shadow-md">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                            </svg>
                        </div>
                        <h2 class="text-lg font-semibold tracking-tight">阶段目标</h2>
                    </div>
                    <textarea id="stageGoal" class="w-full h-24 p-4 text-gray-700 dark:text-gray-200 bg-white/50 dark:bg-black/20 border border-white/60 dark:border-white/10 rounded-apple resize-none input-apple text-sm leading-relaxed" placeholder="这个暑假，我想达成什么目标？..."></textarea>
                </div>

                <!-- 本周重点 + 待办清单 -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- 本周重点 -->
                    <div class="glass-card rounded-apple-xl p-6 fade-in" style="animation-delay: 60ms;">
                        <div class="flex items-center gap-3 mb-5">
                            <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-emerald-400 to-teal-500 flex items-center justify-center text-white shadow-md">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 21v-8a2 2 0 012-2h14a2 2 0 012 2v8M3 21h18M5 21v-8a2 2 0 012-2h14a2 2 0 012 2v8"></path>
                                </svg>
                            </div>
                            <h2 class="text-lg font-semibold tracking-tight">本周重点</h2>
                        </div>
                        <div class="space-y-3" id="flagsContainer">
                            <div class="flex items-start gap-3 flag-item">
                                <button class="check-btn mt-1 w-5 h-5 rounded-full border-2 border-gray-300 dark:border-gray-600 flex items-center justify-center check-circle flex-shrink-0">
                                    <svg class="w-3 h-3 text-white opacity-0 transition-opacity" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
                                    </svg>
                                </button>
                                <input type="text" class="flex-1 text-gray-700 dark:text-gray-200 bg-white/50 dark:bg-black/20 border border-white/60 dark:border-white/10 rounded-xl px-3.5 py-2 text-sm input-apple" placeholder="输入重点目标...">
                            </div>
                            <div class="flex items-start gap-3 flag-item">
                                <button class="check-btn mt-1 w-5 h-5 rounded-full border-2 border-gray-300 dark:border-gray-600 flex items-center justify-center check-circle flex-shrink-0">
                                    <svg class="w-3 h-3 text-white opacity-0 transition-opacity" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
                                    </svg>
                                </button>
                                <input type="text" class="flex-1 text-gray-700 dark:text-gray-200 bg-white/50 dark:bg-black/20 border border-white/60 dark:border-white/10 rounded-xl px-3.5 py-2 text-sm input-apple" placeholder="输入重点目标...">
                            </div>
                            <div class="flex items-start gap-3 flag-item">
                                <button class="check-btn mt-1 w-5 h-5 rounded-full border-2 border-gray-300 dark:border-gray-600 flex items-center justify-center check-circle flex-shrink-0">
                                    <svg class="w-3 h-3 text-white opacity-0 transition-opacity" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
                                    </svg>
                                </button>
                                <input type="text" class="flex-1 text-gray-700 dark:text-gray-200 bg-white/50 dark:bg-black/20 border border-white/60 dark:border-white/10 rounded-xl px-3.5 py-2 text-sm input-apple" placeholder="输入重点目标...">
                            </div>
                            <button id="addFlagBtn" class="w-full py-2.5 text-sm font-medium text-apple-blue dark:text-blue-400 hover:bg-apple-blue/10 rounded-xl transition-colors flex items-center justify-center gap-1.5">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                                </svg>
                                添加重点
                            </button>
                        </div>
                    </div>

                    <!-- 待办清单 -->
                    <div class="glass-card rounded-apple-xl p-6 fade-in" style="animation-delay: 120ms;">
                        <div class="flex items-center gap-3 mb-5">
                            <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-blue-400 to-indigo-500 flex items-center justify-center text-white shadow-md">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path>
                                </svg>
                            </div>
                            <h2 class="text-lg font-semibold tracking-tight">待办清单</h2>
                        </div>
                        <div class="space-y-3" id="todosContainer">
                            <div class="flex items-start gap-3 todo-item">
                                <button class="check-btn mt-1 w-5 h-5 rounded-full border-2 border-gray-300 dark:border-gray-600 flex items-center justify-center check-circle flex-shrink-0">
                                    <svg class="w-3 h-3 text-white opacity-0 transition-opacity" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
                                    </svg>
                                </button>
                                <input type="text" class="flex-1 text-gray-700 dark:text-gray-200 bg-white/50 dark:bg-black/20 border border-white/60 dark:border-white/10 rounded-xl px-3.5 py-2 text-sm input-apple" placeholder="输入待办事项...">
                            </div>
                            <div class="flex items-start gap-3 todo-item">
                                <button class="check-btn mt-1 w-5 h-5 rounded-full border-2 border-gray-300 dark:border-gray-600 flex items-center justify-center check-circle flex-shrink-0">
                                    <svg class="w-3 h-3 text-white opacity-0 transition-opacity" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
                                    </svg>
                                </button>
                                <input type="text" class="flex-1 text-gray-700 dark:text-gray-200 bg-white/50 dark:bg-black/20 border border-white/60 dark:border-white/10 rounded-xl px-3.5 py-2 text-sm input-apple" placeholder="输入待办事项...">
                            </div>
                            <div class="flex items-start gap-3 todo-item">
                                <button class="check-btn mt-1 w-5 h-5 rounded-full border-2 border-gray-300 dark:border-gray-600 flex items-center justify-center check-circle flex-shrink-0">
                                    <svg class="w-3 h-3 text-white opacity-0 transition-opacity" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
                                    </svg>
                                </button>
                                <input type="text" class="flex-1 text-gray-700 dark:text-gray-200 bg-white/50 dark:bg-black/20 border border-white/60 dark:border-white/10 rounded-xl px-3.5 py-2 text-sm input-apple" placeholder="输入待办事项...">
                            </div>
                            <button id="addTodoBtn" class="w-full py-2.5 text-sm font-medium text-apple-blue dark:text-blue-400 hover:bg-apple-blue/10 rounded-xl transition-colors flex items-center justify-center gap-1.5">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                                </svg>
                                添加待办
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 每日时间轴 -->
                <div class="glass-card rounded-apple-xl p-6 fade-in" style="animation-delay: 180ms;">
                    <div class="flex items-center justify-between mb-5">
                        <div class="flex items-center gap-3">
                            <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-purple-400 to-pink-500 flex items-center justify-center text-white shadow-md">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                </svg>
                            </div>
                            <h2 class="text-lg font-semibold tracking-tight">每日时间轴</h2>
                        </div>
                        <button id="addTimeSlotBtn" class="btn-apple px-4 py-2 text-sm font-medium text-apple-blue dark:text-blue-400 bg-apple-blue/10 hover:bg-apple-blue/20 rounded-xl transition-colors flex items-center gap-1.5">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                            </svg>
                            添加时间段
                        </button>
                    </div>
                    <div class="overflow-x-auto -mx-2 px-2">
                        <table class="w-full schedule-table" id="scheduleTable">

    <script>
        // 数据结构
        const scheduleData = { mon: {}, tue: {}, wed: {}, thu: {}, fri: {}, sat: {}, sun: {} };
        let saveTimeout = null;
        let currentBgImage = null;
        let currentPlanId = 'default';

        // 背景预设映射
        const bgPresets = {
            default: 'linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%)',
            ocean: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
            sunset: 'linear-gradient(135deg, #fa709a 0%, #fee140 100%)',
            forest: 'linear-gradient(135deg, #11998e 0%, #38ef7d 100%)',
            sky: 'linear-gradient(135deg, #89f7fe 0%, #66a6ff 100%)',
            candy: 'linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%)',
            midnight: 'linear-gradient(135deg, #1a1a2e 0%, #16213e 100%)',
            dark: '#000000',
            light: 'linear-gradient(135deg, #ffffff 0%, #f0f0f0 100%)',
            aurora: 'linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%)'
        };

        // ============ 计划管理 ============
        function getPlanList() {
            try {
                return JSON.parse(localStorage.getItem('planList') || '[]');
            } catch { return []; }
        }

        function savePlanList(list) {
            localStorage.setItem('planList', JSON.stringify(list));
        }

        function ensureDefaultPlan() {
            let list = getPlanList();
            if (list.length === 0) {
                list = [{ id: 'default', name: '暑假计划', createdAt: Date.now() }];
                savePlanList(list);
            }
            return list;
        }

        function createPlan(name) {
            const list = getPlanList();
            const id = 'plan_' + Date.now();
            list.push({ id, name, createdAt: Date.now() });
            savePlanList(list);
            return id;
        }

        function deletePlan(id) {
            let list = getPlanList();
            if (list.length <= 1) { showToast('至少保留一个计划'); return false; }
            list = list.filter(p => p.id !== id);
            savePlanList(list);
            localStorage.removeItem('planData_' + id);
            return true;
        }

        function renamePlan(id, newName) {
            const list = getPlanList();
            const plan = list.find(p => p.id === id);
            if (plan) { plan.name = newName; savePlanList(list); }
        }

        function switchPlan(id) {
            // 先保存当前计划
            saveCurrentPlan();
            currentPlanId = id;
            localStorage.setItem('currentPlanId', id);
            loadCurrentPlan();
            updatePlanNameDisplay();
        }

        function getCurrentPlanName() {
            const list = getPlanList();
            const plan = list.find(p => p.id === currentPlanId);
            return plan ? plan.name : '未命名计划';
        }

        function updatePlanNameDisplay() {
            document.getElementById('currentPlanName').textContent = getCurrentPlanName();
        }

        // ============ 自动保存（按计划ID分别存储）============
        function scheduleAutoSave() {
            const status = document.getElementById('saveStatus');
            status.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-apple-yellow animate-pulse"></span> 保存中...';
            if (saveTimeout) clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                saveCurrentPlan();
                status.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-apple-green"></span> 已保存';
            }, 800);
        }

        function gatherCurrentData() {
            const data = {
                stageGoal: document.getElementById('stageGoal').value,
                flags: [],
                todos: [],
                scheduleData: JSON.parse(JSON.stringify(scheduleData)),
                background: getBackgroundSettings(),
                savedAt: new Date().toISOString()
            };
            document.querySelectorAll('.flag-item').forEach(item => {
                data.flags.push({
                    text: item.querySelector('input').value,
                    checked: item.querySelector('.check-btn').classList.contains('checked')
                });
            });
            document.querySelectorAll('.todo-item').forEach(item => {
                data.todos.push({
                    text: item.querySelector('input').value,
                    checked: item.querySelector('.check-btn').classList.contains('checked')
                });
            });
            return data;
        }

        function saveCurrentPlan() {
            const data = gatherCurrentData();
            localStorage.setItem('planData_' + currentPlanId, JSON.stringify(data));
        }

        function loadCurrentPlan() {
            const saved = localStorage.getItem('planData_' + currentPlanId);
            // 先清空 scheduleData
            Object.keys(scheduleData).forEach(day => scheduleData[day] = {});
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    applyData(data);
                    if (data.background) applyBackgroundSettings(data.background);
                } catch (e) {
                    console.error('加载失败:', e);
                }
            } else {
                // 新计划，重置UI
                document.getElementById('stageGoal').value = '';
                const flagsContainer = document.getElementById('flagsContainer');
                const flagsAddBtn = document.getElementById('addFlagBtn');
                flagsContainer.innerHTML = '';
                for (let i = 0; i < 3; i++) flagsContainer.appendChild(createFlagItem('', false));
                flagsContainer.appendChild(flagsAddBtn);
                const todosContainer = document.getElementById('todosContainer');
                const todosAddBtn = document.getElementById('addTodoBtn');
                todosContainer.innerHTML = '';
                for (let i = 0; i < 3; i++) todosContainer.appendChild(createTodoItem('', false));
                todosContainer.appendChild(todosAddBtn);
                renderSchedule();
            }
        }

        // ============ 导出/导入 JSON 文件 ============
        function exportPlanAsFile(planId, planName) {
            let data;
            if (planId === currentPlanId) {
                data = gatherCurrentData();
            } else {
                const saved = localStorage.getItem('planData_' + planId);
                data = saved ? JSON.parse(saved) : {};
            }
            const exportData = {
                _format: 'summer-plan-v1',
                _exportedAt: new Date().toISOString(),
                planName: planName,
                ...data
            };
            const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = (planName || '计划') + '_' + new Date().toISOString().slice(0, 10) + '.json';
            a.click();
            URL.revokeObjectURL(url);
            showToast('已导出 ' + planName);
        }

        function importPlanFromFile(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    const planName = data.planName || file.name.replace('.json', '');
                    // 创建新计划
                    const newId = createPlan(planName);
                    // 存储数据
                    const cleanData = { ...data };
                    delete cleanData._format;
                    delete cleanData._exportedAt;
                    delete cleanData.planName;
                    localStorage.setItem('planData_' + newId, JSON.stringify(cleanData));
                    renderPlanList();
                    showToast('已导入计划：' + planName);
                    // 自动切换到导入的计划
                    switchPlan(newId);
                    closePlanModalFn();
                } catch (err) {
                    showToast('导入失败：文件格式不正确');
                }
            };
            reader.readAsText(file);
        }

        function loadFromStorage() {
            // 迁移旧数据
            const oldData = localStorage.getItem('simplePlanData');
            if (oldData && !localStorage.getItem('planData_default')) {
                localStorage.setItem('planData_default', oldData);
                localStorage.removeItem('simplePlanData');
            }
            ensureDefaultPlan();
            // 恢复当前计划ID
            currentPlanId = localStorage.getItem('currentPlanId') || 'default';
            // 如果当前ID不存在于列表中，回退到第一个
            const list = getPlanList();
            if (!list.find(p => p.id === currentPlanId)) {
                currentPlanId = list[0].id;
            }
            loadCurrentPlan();
            updatePlanNameDisplay();
        }

        // ============ 背景设置 ============
        function getBackgroundSettings() {
            const bgLayer = document.getElementById('bgLayer');
            return {
                type: bgLayer.dataset.type || 'default',
                value: bgLayer.dataset.value || 'default',
                image: currentBgImage,
                blur: document.getElementById('bgBlurSlider').value,
                overlay: document.getElementById('bgOverlaySlider').value
            };
        }

        function applyBackgroundSettings(settings) {
            const bgLayer = document.getElementById('bgLayer');
            const { type, value, image, blur, overlay } = settings;

            if (type === 'preset') {
                bgLayer.style.backgroundImage = bgPresets[value] || bgPresets.default;
                if (value === 'dark' || value === 'midnight') {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            } else if (type === 'color') {
                bgLayer.style.backgroundImage = 'none';
                bgLayer.style.backgroundColor = value;
            } else if (type === 'image' && image) {
                bgLayer.style.backgroundImage = `url(${image})`;
            }

            bgLayer.dataset.type = type;
            bgLayer.dataset.value = value;
            if (image) currentBgImage = image;

            if (blur !== undefined) document.getElementById('bgBlurSlider').value = blur;
            if (overlay !== undefined) document.getElementById('bgOverlaySlider').value = overlay;
            updateBgEffects();

            // 更新选中状态
            document.querySelectorAll('.bg-option').forEach(opt => opt.classList.remove('active'));
            if (type === 'preset') {

                applyBackgroundSettings({ type: 'preset', value: 'default', blur: 0, overlay: 0 });

                showToast('已恢复默认背景');

                existingNewRow.querySelector('.new-time-input').focus();
                return;

            const row = document.createElement('tr');
            row.className = 'border-b border-gray-100/50 dark:border-white/5 bg-apple-blue/5 dark:bg-blue-500/10 new-time-row fade-in';
            let cells = `<td class="py-2.5 px-3 border-r border-gray-100/50 dark:border-white/5">
                <input type="text" class="new-time-input w-full text-sm font-semibold text-gray-700 dark:text-gray-200 bg-white/70 dark:bg-black/40 border border-apple-blue/30 focus:border-apple-blue rounded-lg px-2 py-1.5 input-apple" placeholder="如 08:00">
            </td>`;
            ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'].forEach(day => {
                cells += `<td class="py-2 px-2"><input type="text" class="w-full text-gray-400 dark:text-gray-500 bg-white/30 dark:bg-black/10 border border-white/40 dark:border-white/5 rounded-lg px-2 py-1.5 text-sm" placeholder="先输时间" disabled></td>`;
            });
            row.innerHTML = cells;

            tbody.appendChild(row);
            const input = row.querySelector('.new-time-input');
            input.focus();
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') confirmNewTime(row, input.value.trim());
                else if (e.key === 'Escape') cancelNewTime(row);
            });
            input.addEventListener('blur', function() {
                setTimeout(() => {
                    if (document.querySelector('.new-time-row') === row && input.value.trim()) {
                        confirmNewTime(row, input.value.trim());
                    } else if (!input.value.trim()) {
                        cancelNewTime(row);
                    }
                }, 150);
            });
        }

        function confirmNewTime(row, timeStr) {
            if (!timeStr) { cancelNewTime(row); return; }
            const timePattern = /^\d{1,2}:\d{2}$/;
            let formatted = timeStr;
            if (/^\d{1,2}[点时]\d{0,2}$/.test(timeStr)) {
                const parts = timeStr.split(/[点时]/);
                formatted = `${parts[0].padStart(2, '0')}:${(parts[1] || '0').padStart(2, '0')}`;
            }
            if (!timePattern.test(formatted)) {
                showToast('请输入正确的时间格式，如 08:00');
                row.querySelector('.new-time-input').select();
                return;
            }
            if (scheduleData.mon && scheduleData.mon[formatted]) {
                showToast('该时间段已存在');
                cancelNewTime(row);
                return;
            }
            Object.keys(scheduleData).forEach(day => scheduleData[day][formatted] = '');
            renderSchedule();
            scheduleAutoSave();
            showToast('已添加 ' + formatted);
        }

        function cancelNewTime(row) {
            row.remove();
            const tbody = document.getElementById('scheduleBody');
            const allTimes = new Set();
            Object.values(scheduleData).forEach(dayData => Object.keys(dayData).forEach(time => allTimes.add(time)));
            if (allTimes.size === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="py-12 text-center text-gray-400 dark:text-gray-500 text-sm">

                    </div>
                </td></tr>`;

        }

        // ============ 文本智能解析 ============
        function parseTextContent(text) {
            const result = { flags: [], todos: [], schedule: {}, scheduleByDay: {}, goal: '' };
            const lines = text.split('\n').map(l => l.trim()).filter(l => l);

            const goalKeywords = ['目标', 'goal', '目的', '计划目标', '暑假目标', '学习目标', '总体目标', '最终目标', '期望目标', 'objective', 'target'];
            const flagKeywords = ['重点', 'flag', '主要任务', '核心任务', '关键任务', '重要任务', '本周重点', '本周核心', '重点任务', 'priority', 'focus'];
            const todoKeywords = ['待办', 'todo', '任务', '清单', '事项', '待办事项', '任务清单', '待处理', '待完成', 'to-do', 'task', 'checklist'];
            const scheduleKeywords = ['时间', 'time', '日程', '安排', '时间表', '日程表', '作息表', '时间安排', '每日安排', 'schedule', 'timetable'];

            const timePatterns = [
                /^(\d{1,2}):(\d{2})\s*[-~—–]\s*(\d{1,2}):(\d{2})\s*(.*)$/,
                /^(\d{1,2}):(\d{2})\s*(.*)$/,
                /^(\d{1,2})\s*[:点]\s*(\d{0,2})\s*(.*)$/,
                /^(\d{1,2})\s*[时]\s*(.*)$/
            ];

            const listPatterns = [
                /^(\d+)\s*[\.\)\、]\s*(.+)$/,
                /^[\-\*\+•●◆■]\s*(.+)$/,
                /^[\u2022\u2023\u25E6]\s*(.+)$/,
                /^\[(.)\]\s*(.+)$/,
                /^(\d+)\s*(.+)$/
            ];

            let currentSection = '';

            lines.forEach((line, idx) => {
                if (!line) return;
                let matched = false;

                if (goalKeywords.some(k => line.includes(k))) {
                    const value = line.replace(/^.*?(目标|目的|objective|target)\s*[：:]\s*/i, '').replace(/^[【】\[\]《》\s]+/, '').replace(/[【】\[\]《》\s]+$/, '');
                    if (value && value.length > 2) result.goal = value;
                    else if (!result.goal) {
                        const nextLine = lines[idx + 1] || '';
                        if (nextLine && !goalKeywords.some(k => nextLine.includes(k))) result.goal = nextLine.trim();
                    }
                    matched = true;
                }

                let timeMatched = false;
                for (const pattern of timePatterns) {
                    const match = line.match(pattern);
                    if (match) {
                        let timeStr;
                        const h1 = match[1] || '';
                        const m1 = match[2] || '0';
                        if (match[3] && /^\d+$/.test(match[3])) {
                            timeStr = `${h1.padStart(2, '0')}:${m1.padStart(2, '0')}-${match[3].padStart(2, '0')}:${(match[4] || '0').padStart(2, '0')}`;
                        } else {
                            timeStr = `${h1.padStart(2, '0')}:${m1.padStart(2, '0')}`;
                        }
                        const content = match[match.length - 1] || '';
                        const trimmedContent = content.trim();

                        if (trimmedContent.includes('|')) {
                            const dayParts = trimmedContent.split('|');
                            const dayOrder = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
                            const scheduleKeys = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];
                            dayParts.forEach(part => {
                                const trimmedPart = part.trim();
                                if (trimmedPart.includes('每天') || trimmedPart.includes('日常')) {
                                    const activity = trimmedPart.replace(/(每天|日常)\s*[：:]\s*/, '').trim();
                                    if (activity) scheduleKeys.forEach(dayKey => setSchedule(dayKey, timeStr, activity));
                                } else if (trimmedPart.includes('周一至周五') || trimmedPart.includes('周一到周五')) {
                                    const activity = trimmedPart.replace(/(周一至周五|周一到周五)\s*[：:]\s*/, '').trim();
                                    if (activity) ['mon', 'tue', 'wed', 'thu', 'fri'].forEach(dayKey => setSchedule(dayKey, timeStr, activity));
                                } else if (trimmedPart.includes('周一至周六') || trimmedPart.includes('周一到周六')) {
                                    const activity = trimmedPart.replace(/(周一至周六|周一到周六)\s*[：:]\s*/, '').trim();
                                    if (activity) ['mon', 'tue', 'wed', 'thu', 'fri', 'sat'].forEach(dayKey => setSchedule(dayKey, timeStr, activity));
                                } else {
                                    const dayNameMatch = trimmedPart.match(/(周一|周二|周三|周四|周五|周六|周日)/);
                                    if (dayNameMatch) {
                                        const dayKey = scheduleKeys[dayOrder.indexOf(dayNameMatch[0])];
                                        const activity = trimmedPart.replace(/(周一|周二|周三|周四|周五|周六|周日)\s*[：:]\s*/, '').trim();
                                        if (activity) setSchedule(dayKey, timeStr, activity);
                                    }
                                }
                            });
                        } else if (trimmedContent.includes('每天') || trimmedContent.includes('日常')) {
                            const activity = trimmedContent.replace(/(每天|日常)\s*[：:]\s*/, '').trim();
                            if (activity) ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'].forEach(dayKey => setSchedule(dayKey, timeStr, activity));
                        } else if (trimmedContent.includes('周一至周五') || trimmedContent.includes('周一到周五')) {
                            const activity = trimmedContent.replace(/(周一至周五|周一到周五)\s*[：:]\s*/, '').trim();
                            if (activity) ['mon', 'tue', 'wed', 'thu', 'fri'].forEach(dayKey => setSchedule(dayKey, timeStr, activity));
                        } else if (trimmedContent.includes('周一至周六') || trimmedContent.includes('周一到周六')) {
                            const activity = trimmedContent.replace(/(周一至周六|周一到周六)\s*[：:]\s*/, '').trim();
                            if (activity) ['mon', 'tue', 'wed', 'thu', 'fri', 'sat'].forEach(dayKey => setSchedule(dayKey, timeStr, activity));
                        } else {
                            const dayOrder = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
                            const scheduleKeys = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];
                            const dayNameMatch = trimmedContent.match(/(周一|周二|周三|周四|周五|周六|周日)/);
                            if (dayNameMatch) {
                                const dayKey = scheduleKeys[dayOrder.indexOf(dayNameMatch[0])];
                                const activity = trimmedContent.replace(/(周一|周二|周三|周四|周五|周六|周日)\s*[：:]\s*/, '').trim();
                                if (activity) setSchedule(dayKey, timeStr, activity);
                            } else {
                                result.schedule[timeStr] = trimmedContent;
                            }
                        }

                        timeMatched = true;
                        matched = true;
                        break;
                    }
                }

                if (!matched && goalKeywords.some(k => line.includes(k))) matched = true;
                if (!matched && flagKeywords.some(k => line.includes(k))) { currentSection = 'flags'; matched = true; }
                if (!matched && todoKeywords.some(k => line.includes(k))) { currentSection = 'todos'; matched = true; }
                if (!matched && scheduleKeywords.some(k => line.includes(k))) { currentSection = 'schedule'; matched = true; }
                if (!matched && line.match(/^[周一二三四五六日]\s*[：:]/)) { currentSection = 'schedule'; matched = true; }

                if (!matched) {
                    for (const pattern of listPatterns) {
                        const match = line.match(pattern);
                        if (match) {
                            const content = match[match.length - 1].trim();
                            if (content && content.length > 1) {
                                if (currentSection === 'flags') result.flags.push({ text: content, checked: false });
                                else if (currentSection === 'todos') result.todos.push({ text: content, checked: false });
                                else {
                                    if (isFlagContent(content)) result.flags.push({ text: content, checked: false });
                                    else {
                                        if (result.flags.length < 5) result.flags.push({ text: content, checked: false });
                                        else if (result.todos.length < 10) result.todos.push({ text: content, checked: false });
                                    }
                                }
                            }
                            matched = true;
                            break;
                        }
                    }
                }

                if (!matched && !currentSection && line.length > 2 && line.length < 80) {
                    if (isFlagContent(line)) result.flags.push({ text: line, checked: false });
                    else if (result.flags.length < 3) result.flags.push({ text: line, checked: false });
                }
            });

            function setSchedule(dayKey, time, activity) {
                if (!result.scheduleByDay[dayKey]) result.scheduleByDay[dayKey] = {};
                result.scheduleByDay[dayKey][time] = activity;
            }

            function isFlagContent(text) {
                const indicators = ['完成', '达到', '实现', '掌握', '学会', '通过', '目标', '计划', '复习', '学习'];
                return indicators.some(i => text.includes(i));
            }

            return result;
        }

        // ============ 导入数据 ============
        function applyImportedData(data) {
            if (data.goal) document.getElementById('stageGoal').value = data.goal;

            const flagsContainer = document.getElementById('flagsContainer');
            const flagsAddBtn = document.getElementById('addFlagBtn');
            flagsContainer.innerHTML = '';
            if (data.flags && data.flags.length > 0) data.flags.forEach(flag => flagsContainer.appendChild(createFlagItem(flag.text, flag.checked)));
            flagsContainer.appendChild(flagsAddBtn);

            const todosContainer = document.getElementById('todosContainer');
            const todosAddBtn = document.getElementById('addTodoBtn');
            todosContainer.innerHTML = '';
            if (data.todos && data.todos.length > 0) data.todos.forEach(todo => todosContainer.appendChild(createTodoItem(todo.text, todo.checked)));
            todosContainer.appendChild(todosAddBtn);

            Object.keys(scheduleData).forEach(day => scheduleData[day] = {});

            if (data.scheduleByDay && Object.keys(data.scheduleByDay).length > 0) {
                Object.keys(data.scheduleByDay).forEach(dayKey => {
                    if (scheduleData[dayKey]) {
                        Object.keys(data.scheduleByDay[dayKey]).forEach(time => {
                            scheduleData[dayKey][time] = data.scheduleByDay[dayKey][time] || '';
                        });
                    }
                });
            }

            if (data.schedule && Object.keys(data.schedule).length > 0) {
                const days = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];
                Object.keys(data.schedule).forEach(time => {
                    days.forEach(day => { if (!scheduleData[day][time]) scheduleData[day][time] = data.schedule[time] || ''; });
                });
            }

            renderSchedule();
            scheduleAutoSave();
            showToast('导入成功！');
        }

        // ============ Toast ============
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.remove('opacity-0', 'translate-y-2', 'pointer-events-none');
            setTimeout(() => toast.classList.add('opacity-0', 'translate-y-2', 'pointer-events-none'), 2200);
        }

        // ============ 事件绑定 ============
        function initEvents() {
            document.getElementById('addFlagBtn').addEventListener('click', addFlag);
            document.getElementById('addTodoBtn').addEventListener('click', addTodo);
            document.getElementById('addTimeSlotBtn').addEventListener('click', addTimeSlot);
            document.getElementById('exportBtn').addEventListener('click', exportExcel);

            document.getElementById('clearBtn').addEventListener('click', function() {
                if (confirm('确定要清空当前计划「' + getCurrentPlanName() + '」的所有内容吗？')) {
                    localStorage.removeItem('planData_' + currentPlanId);
                    Object.keys(scheduleData).forEach(day => scheduleData[day] = {});
                    document.getElementById('stageGoal').value = '';

                    const flagsContainer = document.getElementById('flagsContainer');
                    const flagsAddBtn = document.getElementById('addFlagBtn');
                    flagsContainer.innerHTML = '';
                    for (let i = 0; i < 3; i++) flagsContainer.appendChild(createFlagItem('', false));
                    flagsContainer.appendChild(flagsAddBtn);

                    const todosContainer = document.getElementById('todosContainer');
                    const todosAddBtn = document.getElementById('addTodoBtn');
                    todosContainer.innerHTML = '';
                    for (let i = 0; i < 3; i++) todosContainer.appendChild(createTodoItem('', false));
                    todosContainer.appendChild(todosAddBtn);

                    renderSchedule();
                    scheduleAutoSave();
                    showToast('已清空当前计划');
                }
            });

            document.getElementById('stageGoal').addEventListener('input', scheduleAutoSave);

            document.getElementById('scheduleBody').addEventListener('input', function(e) {
                if (e.target.classList.contains('schedule-input')) {
                    const day = e.target.dataset.day;
                    const time = e.target.dataset.time;
                    scheduleData[day][time] = e.target.value;
                    scheduleAutoSave();
                }
            });

            document.getElementById('scheduleBody').addEventListener('click', function(e) {
                if (e.target.closest('.delete-time-btn')) {
                    const btn = e.target.closest('.delete-time-btn');
                    const time = btn.dataset.time;
                    if (confirm('确定要删除时间段 ' + time + ' 吗？')) deleteTimeSlot(time);
                }
            });

            document.getElementById('scheduleBody').addEventListener('blur', function(e) {
                if (e.target.classList.contains('time-edit-input')) {
                    const originalTime = e.target.dataset.originalTime;
                    const newTime = e.target.value.trim();
                    if (newTime && newTime !== originalTime) {
                        const timePattern = /^\d{1,2}:\d{2}(-\d{1,2}:\d{2})?$/;
                        if (timePattern.test(newTime)) {
                            if (scheduleData.mon[newTime]) {
                                showToast('该时间段已存在');
                                e.target.value = originalTime;
                                return;
                            }
                            Object.keys(scheduleData).forEach(day => {
                                if (scheduleData[day][originalTime] !== undefined) {
                                    scheduleData[day][newTime] = scheduleData[day][originalTime];
                                    delete scheduleData[day][originalTime];
                                }
                            });
                            renderSchedule();
                            scheduleAutoSave();
                            showToast('时间已修改为 ' + newTime);
                        } else {
                            showToast('请输入正确的时间格式，如 08:00');
                            e.target.value = originalTime;
                        }
                    } else if (!newTime) e.target.value = originalTime;
                }
            });

            document.getElementById('scheduleBody').addEventListener('keydown', function(e) {
                if (e.target.classList.contains('time-edit-input')) {
                    if (e.key === 'Enter') e.target.blur();
                    else if (e.key === 'Escape') { e.target.value = e.target.dataset.originalTime; e.target.blur(); }
                }
            });

            // 粘贴导入弹窗
            const pasteModal = document.getElementById('pasteModal');
            const pasteModalContent = document.getElementById('pasteModalContent');
            document.getElementById('pasteBtn').addEventListener('click', () => {
                pasteModal.classList.remove('opacity-0', 'pointer-events-none');
                pasteModalContent.classList.remove('scale-95');
                pasteModalContent.classList.add('scale-100');
                document.getElementById('pasteTextArea').focus();
            });

            function closePasteModal() {
                pasteModal.classList.add('opacity-0', 'pointer-events-none');
                pasteModalContent.classList.remove('scale-100');
                pasteModalContent.classList.add('scale-95');
            }

            document.getElementById('closePasteModal').addEventListener('click', closePasteModal);
            document.getElementById('cancelPasteBtn').addEventListener('click', closePasteModal);
            pasteModal.addEventListener('click', (e) => { if (e.target === pasteModal) closePasteModal(); });

            document.getElementById('confirmPasteBtn').addEventListener('click', () => {
                const text = document.getElementById('pasteTextArea').value;
                if (!text.trim()) { showToast('请输入内容'); return; }
                const data = parseTextContent(text);
                applyImportedData(data);
                closePasteModal();
                document.getElementById('pasteTextArea').value = '';
            });

            // ============ 计划管理弹窗 ============
            const planModal = document.getElementById('planModal');
            const planModalContent = document.getElementById('planModalContent');

            function closePlanModalFn() {
                planModal.classList.add('opacity-0', 'pointer-events-none');
                planModalContent.classList.remove('scale-100');
                planModalContent.classList.add('scale-95');
            }

            function openPlanModal() {
                renderPlanList();
                planModal.classList.remove('opacity-0', 'pointer-events-none');
                planModalContent.classList.remove('scale-95');
                planModalContent.classList.add('scale-100');
            }

            document.getElementById('planSwitcher').addEventListener('click', openPlanModal);
            document.getElementById('closePlanModal').addEventListener('click', closePlanModalFn);
            planModal.addEventListener('click', (e) => { if (e.target === planModal) closePlanModalFn(); });

            // 新建计划
            document.getElementById('createPlanBtn').addEventListener('click', () => {
                const input = document.getElementById('newPlanNameInput');
                const name = input.value.trim();
                if (!name) { showToast('请输入计划名称'); return; }
                const newId = createPlan(name);
                input.value = '';
                switchPlan(newId);
                renderPlanList();
                showToast('已创建计划：' + name);
                closePlanModalFn();
            });

            document.getElementById('newPlanNameInput').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') document.getElementById('createPlanBtn').click();
            });

            // 导出当前计划为JSON
            document.getElementById('exportCurrentPlanBtn').addEventListener('click', () => {
                exportPlanAsFile(currentPlanId, getCurrentPlanName());
            });

            // 导入JSON文件
            document.getElementById('importPlanFileBtn').addEventListener('click', () => {
                document.getElementById('importPlanFileInput').click();
            });

            document.getElementById('importPlanFileInput').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) importPlanFromFile(file);
                e.target.value = '';
            });
        }

        // ============ 渲染计划列表 ============
        function renderPlanList() {
            const list = getPlanList();
            const container = document.getElementById('planList');
            container.innerHTML = '';

            list.forEach(plan => {
                const isActive = plan.id === currentPlanId;
                const div = document.createElement('div');
                div.className = `flex items-center gap-3 p-3 rounded-xl transition-colors ${isActive ? 'bg-apple-blue/10 border border-apple-blue/20' : 'bg-white/30 dark:bg-black/10 border border-white/40 dark:border-white/5 hover:bg-white/50 dark:hover:bg-black/20'}`;

                const planData = localStorage.getItem('planData_' + plan.id);
                let savedInfo = '';
                if (planData) {
                    try {
                        const d = JSON.parse(planData);
                        if (d.savedAt) savedInfo = ' · ' + new Date(d.savedAt).toLocaleDateString();
                    } catch {}
                }

                div.innerHTML = `
                    <div class="w-9 h-9 rounded-xl ${isActive ? 'bg-gradient-to-br from-apple-blue to-cyan-400' : 'bg-gray-200 dark:bg-gray-700'} flex items-center justify-center flex-shrink-0">
                        <svg class="w-5 h-5 ${isActive ? 'text-white' : 'text-gray-500 dark:text-gray-400'}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                        </svg>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-2">
                            <span class="text-sm font-semibold ${isActive ? 'text-apple-blue' : 'text-gray-800 dark:text-gray-200'} truncate plan-name-display" data-plan-id="${plan.id}">${plan.name}</span>
                            ${isActive ? '<span class="text-[10px] font-bold text-apple-blue bg-apple-blue/15 px-1.5 py-0.5 rounded-md whitespace-nowrap">当前</span>' : ''}
                        </div>
                        <p class="text-[11px] text-gray-400 dark:text-gray-500 mt-0.5">${new Date(plan.createdAt).toLocaleDateString()}${savedInfo}</p>
                    </div>
                    <div class="flex items-center gap-1 flex-shrink-0">
                        ${!isActive ? `<button class="switch-plan-btn p-2 text-apple-blue hover:bg-apple-blue/10 rounded-lg transition-colors" data-plan-id="${plan.id}" title="切换到此计划">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"></path>
                            </svg>
                        </button>` : ''}
                        <button class="export-plan-btn p-2 text-gray-400 hover:text-apple-blue hover:bg-apple-blue/10 rounded-lg transition-colors" data-plan-id="${plan.id}" data-plan-name="${plan.name}" title="导出为JSON文件">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                            </svg>
                        </button>
                        <button class="rename-plan-btn p-2 text-gray-400 hover:text-amber-500 hover:bg-amber-50 dark:hover:bg-amber-500/10 rounded-lg transition-colors" data-plan-id="${plan.id}" data-plan-name="${plan.name}" title="重命名">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path>
                            </svg>
                        </button>
                        ${list.length > 1 ? `<button class="delete-plan-btn p-2 text-gray-400 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-500/10 rounded-lg transition-colors" data-plan-id="${plan.id}" title="删除计划">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                            </svg>
                        </button>` : ''}
                    </div>
                `;
                container.appendChild(div);
            });

            // 事件绑定
            container.querySelectorAll('.switch-plan-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    switchPlan(btn.dataset.planId);
                    renderPlanList();
                    showToast('已切换到：' + getCurrentPlanName());
                    closePlanModalFn();
                });
            });

            container.querySelectorAll('.export-plan-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    exportPlanAsFile(btn.dataset.planId, btn.dataset.planName);
                });
            });

            container.querySelectorAll('.delete-plan-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const planId = btn.dataset.planId;
                    const planList = getPlanList();
                    const plan = planList.find(p => p.id === planId);
                    if (confirm('确定要删除计划「' + (plan ? plan.name : '') + '」吗？此操作不可撤销。')) {
                        if (deletePlan(planId)) {
                            if (planId === currentPlanId) {
                                currentPlanId = getPlanList()[0].id;
                                localStorage.setItem('currentPlanId', currentPlanId);
                                loadCurrentPlan();
                                updatePlanNameDisplay();
                            }
                            renderPlanList();
                            showToast('已删除计划');
                        }
                    }
                });
            });

            container.querySelectorAll('.rename-plan-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const planId = btn.dataset.planId;
                    const planList = getPlanList();
                    const plan = planList.find(p => p.id === planId);
                    const newName = prompt('输入新名称：', plan ? plan.name : '');
                    if (newName && newName.trim()) {
                        renamePlan(planId, newName.trim());
                        if (planId === currentPlanId) updatePlanNameDisplay();
                        renderPlanList();
                        showToast('已重命名');
                    }
                });
            });
        }

        // ============ 初始化 ============
        loadFromStorage();
        initEvents();
        initBackgroundEvents();
    </script>
</body>
</html>
