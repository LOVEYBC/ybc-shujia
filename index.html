<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>暑假学习计划 - 智能版</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            200: '#bae6fd',
                            300: '#7dd3fc',
                            400: '#38bdf8',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                            800: '#075985',
                            900: '#0c4a6e',
                        },
                        dark: {
                            bg: '#1a1a2e',
                            card: '#16213e',
                            border: '#0f3460',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                },
            },
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', system-ui, sans-serif; transition: background-color 0.3s ease, color 0.3s ease; }
        .dark body { background-color: #1a1a2e; color: #e2e8f0; }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); }
        .dark .glass { background: rgba(22, 33, 62, 0.8); border: 1px solid rgba(15, 52, 96, 0.5); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.05); border-radius: 3px; }
        .dark .custom-scrollbar::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.05); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.1); border-radius: 3px; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); }
        .input-focus-ring:focus { outline: none; box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.2); }
        .dark .input-focus-ring:focus { box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2); }
        .check-circle { transition: all 0.2s ease; }
        .check-circle.checked { background-color: #0ea5e9; border-color: #0ea5e9; }
        .dark .check-circle.checked { background-color: #38bdf8; border-color: #38bdf8; }
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .tab-active { border-bottom: 2px solid #0ea5e9; color: #0ea5e9; }
        .dark .tab-active { border-bottom: 2px solid #38bdf8; color: #38bdf8; }
        .drag-over { border-color: #0ea5e9 !important; background-color: rgba(14, 165, 233, 0.05) !important; }
        .dark .drag-over { background-color: rgba(56, 189, 248, 0.1) !important; }
        .save-indicator { transition: opacity 0.3s; }
        .save-indicator.saving { opacity: 1; }
        .save-indicator.saved { opacity: 0.5; }
    </style>
</head>
<body class="bg-white min-h-screen">
    <div class="min-h-screen flex flex-col">
        <header class="sticky top-0 z-50 glass border-b border-gray-100 dark:border-dark-border">
            <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-primary-500 flex items-center justify-center text-white font-bold text-lg">✏️</div>
                    <div>
                        <h1 class="text-xl font-semibold text-gray-800 dark:text-white">暑假计划</h1>
                        <p class="text-xs text-gray-500 dark:text-gray-400">智能导入 · 自动保存 · 精美导出</p>
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <span id="saveStatus" class="text-xs text-gray-400 flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-green-500"></span> 已保存</span>
                    <button id="undoBtn" class="px-3 py-2 text-sm font-medium text-gray-600 dark:text-gray-300 hover:text-primary-600 dark:hover:text-primary-400 bg-gray-50 dark:bg-dark-card rounded-lg transition-colors disabled:opacity-40" disabled>↩️ 撤销</button>
                    <button id="copyBtn" class="px-3 py-2 text-sm font-medium text-gray-600 dark:text-gray-300 hover:text-primary-600 dark:hover:text-primary-400 bg-gray-50 dark:bg-dark-card rounded-lg transition-colors">📋 复制</button>
                    <button id="exportBtn" class="px-3 py-2 text-sm font-medium text-white bg-primary-500 hover:bg-primary-600 rounded-lg transition-colors">📊 导出Excel</button>
                    <button id="exportJsonBtn" class="px-3 py-2 text-sm font-medium text-gray-600 dark:text-gray-300 hover:text-primary-600 dark:hover:text-primary-400 bg-gray-50 dark:bg-dark-card rounded-lg transition-colors">💾 导出JSON</button>
                    <button id="themeBtn" class="w-10 h-10 rounded-full bg-gray-100 dark:bg-dark-card flex items-center justify-center text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-dark-border transition-colors">🌙</button>
                </div>
            </div>
        </header>

        <div class="flex-1 flex">
            <aside class="w-64 shrink-0 border-r border-gray-100 dark:border-dark-border bg-gray-50/50 dark:bg-dark-bg/50 p-4 overflow-y-auto custom-scrollbar">
                <h2 class="text-sm font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-4">自创模板</h2>
                <div class="space-y-2">
                    <button class="template-btn w-full text-left px-4 py-3 rounded-xl bg-white dark:bg-dark-card border border-gray-200 dark:border-dark-border hover:border-primary-300 dark:hover:border-primary-500 hover:shadow-sm transition-all" data-template="optimal-summer">
                        <div class="flex items-center gap-3">
                            <span class="text-2xl">☀️</span>
                            <div>
                                <div class="font-medium text-gray-800 dark:text-white">高效暑假模板</div>
                                <div class="text-xs text-gray-500 dark:text-gray-400">学习+休息+复盘 三合一</div>
                            </div>
                        </div>
                    </button>
                </div>

                <div class="mt-6">
                    <h2 class="text-sm font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-4">导入数据</h2>
                    <div class="border-2 border-dashed border-gray-300 dark:border-dark-border rounded-xl p-4 text-center hover:border-primary-400 dark:hover:border-primary-400 transition-colors cursor-pointer" id="dropZone">
                        <div class="text-4xl mb-2">📥</div>
                        <div class="text-sm text-gray-600 dark:text-gray-300">拖拽文件到此处</div>
                        <div class="text-xs text-gray-400 mt-1">支持 Excel/Word/CSV/TXT/JSON</div>
                        <input type="file" id="importFile" class="hidden" accept=".xlsx,.xls,.docx,.csv,.txt,.json">
                    </div>
                    <button id="selectFileBtn" class="mt-3 w-full py-2 text-sm text-primary-500 dark:text-primary-400 hover:bg-primary-50 dark:hover:bg-primary-900/20 rounded-lg transition-colors">📁 选择文件</button>
                    <button id="pasteTextBtn" class="mt-2 w-full py-2 text-sm text-primary-500 dark:text-primary-400 hover:bg-primary-50 dark:hover:bg-primary-900/20 rounded-lg transition-colors">📋 粘贴文本</button>
                </div>

                <div class="mt-6">
                    <h2 class="text-sm font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-4">快捷操作</h2>
                    <button id="clearBtn" class="w-full px-4 py-2 text-sm text-gray-500 dark:text-gray-400 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20 rounded-lg transition-colors">🗑️ 清空所有内容</button>
                    <button id="loadSampleBtn" class="mt-2 w-full px-4 py-2 text-sm text-gray-500 dark:text-gray-400 hover:text-primary-500 hover:bg-primary-50 dark:hover:bg-primary-900/20 rounded-lg transition-colors">📝 加载示例数据</button>
                </div>
            </aside>

            <main class="flex-1 overflow-y-auto custom-scrollbar p-6">
                <div class="max-w-4xl mx-auto space-y-6">
                    <div class="bg-white dark:bg-dark-card rounded-2xl border border-gray-100 dark:border-dark-border p-6 shadow-sm">
                        <h2 class="text-lg font-semibold text-gray-800 dark:text-white mb-4">📌 阶段目标</h2>
                        <textarea id="stageGoal" class="w-full h-24 p-4 text-gray-700 dark:text-gray-300 bg-gray-50 dark:bg-dark-bg border border-gray-200 dark:border-dark-border rounded-xl resize-none input-focus-ring transition-all" placeholder="这个暑假，我想达成什么目标？..."></textarea>
                    </div>

                    <div class="grid grid-cols-2 gap-6">
                        <div class="bg-white dark:bg-dark-card rounded-2xl border border-gray-100 dark:border-dark-border p-6 shadow-sm">
                            <h2 class="text-lg font-semibold text-gray-800 dark:text-white mb-4">🚩 本周重点</h2>
                            <div class="space-y-3" id="flagsContainer">
                                <div class="flex items-start gap-3 flag-item"><button class="check-btn mt-1 w-5 h-5 rounded-full border-2 border-gray-300 dark:border-gray-600 flex items-center justify-center check-circle"><svg class="w-3 h-3 text-white opacity-0 transition-opacity" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg></button><input type="text" class="flex-1 text-gray-700 dark:text-gray-300 bg-gray-50 dark:bg-dark-bg border border-gray-200 dark:border-dark-border rounded-lg px-3 py-2 text-sm input-focus-ring" placeholder="输入重点目标..."></div>
                                <div class="flex items-start gap-3 flag-item"><button class="check-btn mt-1 w-5 h-5 rounded-full border-2 border-gray-300 dark:border-gray-600 flex items-center justify-center check-circle"><svg class="w-3 h-3 text-white opacity-0 transition-opacity" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg></button><input type="text" class="flex-1 text-gray-700 dark:text-gray-300 bg-gray-50 dark:bg-dark-bg border border-gray-200 dark:border-dark-border rounded-lg px-3 py-2 text-sm input-focus-ring" placeholder="输入重点目标..."></div>
                                <div class="flex items-start gap-3 flag-item"><button class="check-btn mt-1 w-5 h-5 rounded-full border-2 border-gray-300 dark:border-gray-600 flex items-center justify-center check-circle"><svg class="w-3 h-3 text-white opacity-0 transition-opacity" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg></button><input type="text" class="flex-1 text-gray-700 dark:text-gray-300 bg-gray-50 dark:bg-dark-bg border border-gray-200 dark:border-dark-border rounded-lg px-3 py-2 text-sm input-focus-ring" placeholder="输入重点目标..."></div>
                                <button id="addFlagBtn" class="w-full py-2 text-sm text-primary-500 dark:text-primary-400 hover:bg-primary-50 dark:hover:bg-primary-900/20 rounded-lg transition-colors">+ 添加重点</button>
                            </div>
                        </div>

                        <div class="bg-white dark:bg-dark-card rounded-2xl border border-gray-100 dark:border-dark-border p-6 shadow-sm">
                            <h2 class="text-lg font-semibold text-gray-800 dark:text-white mb-4">📋 待办清单</h2>
                            <div class="space-y-3" id="todosContainer">
                                <div class="flex items-start gap-3 todo-item"><button class="check-btn mt-1 w-5 h-5 rounded-full border-2 border-gray-300 dark:border-gray-600 flex items-center justify-center check-circle"><svg class="w-3 h-3 text-white opacity-0 transition-opacity" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg></button><input type="text" class="flex-1 text-gray-700 dark:text-gray-300 bg-gray-50 dark:bg-dark-bg border border-gray-200 dark:border-dark-border rounded-lg px-3 py-2 text-sm input-focus-ring" placeholder="输入待办事项..."></div>
                                <div class="flex items-start gap-3 todo-item"><button class="check-btn mt-1 w-5 h-5 rounded-full border-2 border-gray-300 dark:border-gray-600 flex items-center justify-center check-circle"><svg class="w-3 h-3 text-white opacity-0 transition-opacity" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg></button><input type="text" class="flex-1 text-gray-700 dark:text-gray-300 bg-gray-50 dark:bg-dark-bg border border-gray-200 dark:border-dark-border rounded-lg px-3 py-2 text-sm input-focus-ring" placeholder="输入待办事项..."></div>
                                <div class="flex items-start gap-3 todo-item"><button class="check-btn mt-1 w-5 h-5 rounded-full border-2 border-gray-300 dark:border-gray-600 flex items-center justify-center check-circle"><svg class="w-3 h-3 text-white opacity-0 transition-opacity" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg></button><input type="text" class="flex-1 text-gray-700 dark:text-gray-300 bg-gray-50 dark:bg-dark-bg border border-gray-200 dark:border-dark-border rounded-lg px-3 py-2 text-sm input-focus-ring" placeholder="输入待办事项..."></div>
                                <button id="addTodoBtn" class="w-full py-2 text-sm text-primary-500 dark:text-primary-400 hover:bg-primary-50 dark:hover:bg-primary-900/20 rounded-lg transition-colors">+ 添加待办</button>
                            </div>
                        </div>
                    </div>

                    <div class="bg-white dark:bg-dark-card rounded-2xl border border-gray-100 dark:border-dark-border p-6 shadow-sm">
                        <div class="flex items-center justify-between mb-4">
                            <h2 class="text-lg font-semibold text-gray-800 dark:text-white">⏰ 每日时间轴</h2>
                            <div class="flex gap-2">
                                <button class="tab-btn text-sm font-medium px-3 py-1 rounded-lg transition-colors tab-active" data-day="mon">周一</button>
                                <button class="tab-btn text-sm font-medium px-3 py-1 rounded-lg transition-colors text-gray-500 dark:text-gray-400" data-day="tue">周二</button>
                                <button class="tab-btn text-sm font-medium px-3 py-1 rounded-lg transition-colors text-gray-500 dark:text-gray-400" data-day="wed">周三</button>
                                <button class="tab-btn text-sm font-medium px-3 py-1 rounded-lg transition-colors text-gray-500 dark:text-gray-400" data-day="thu">周四</button>
                                <button class="tab-btn text-sm font-medium px-3 py-1 rounded-lg transition-colors text-gray-500 dark:text-gray-400" data-day="fri">周五</button>
                                <button class="tab-btn text-sm font-medium px-3 py-1 rounded-lg transition-colors text-gray-500 dark:text-gray-400" data-day="sat">周六</button>
                                <button class="tab-btn text-sm font-medium px-3 py-1 rounded-lg transition-colors text-gray-500 dark:text-gray-400" data-day="sun">周日</button>
                            </div>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full" id="scheduleTable">
                                <thead><tr class="border-b border-gray-200 dark:border-dark-border"><th class="text-left py-3 px-4 text-sm font-semibold text-gray-500 dark:text-gray-400 w-20">时间</th><th class="text-left py-3 px-4 text-sm font-semibold text-gray-500 dark:text-gray-400">安排</th></tr></thead>
                                <tbody id="scheduleBody"></tbody>
                            </table>
                        </div>
                        <button id="addTimeSlotBtn" class="mt-4 w-full py-2 text-sm text-primary-500 dark:text-primary-400 hover:bg-primary-50 dark:hover:bg-primary-900/20 rounded-lg transition-colors">+ 添加时间段</button>
                    </div>

                    <div class="grid grid-cols-2 gap-6">
                        <div class="bg-white dark:bg-dark-card rounded-2xl border border-gray-100 dark:border-dark-border p-6 shadow-sm">
                            <h2 class="text-lg font-semibold text-gray-800 dark:text-white mb-4">🌱 习惯打卡</h2>
                            <div class="space-y-3" id="habitsContainer">
                                <div class="flex items-center justify-between habit-item">
                                    <input type="text" class="flex-1 text-gray-700 dark:text-gray-300 bg-gray-50 dark:bg-dark-bg border border-gray-200 dark:border-dark-border rounded-lg px-3 py-2 text-sm input-focus-ring" placeholder="习惯名称...">
                                    <div class="flex gap-1 ml-3">
                                        <button class="habit-check-btn w-6 h-6 rounded border border-gray-200 dark:border-dark-border flex items-center justify-center text-xs hover:bg-primary-500 hover:text-white transition-colors">一</button>
                                        <button class="habit-check-btn w-6 h-6 rounded border border-gray-200 dark:border-dark-border flex items-center justify-center text-xs hover:bg-primary-500 hover:text-white transition-colors">二</button>
                                        <button class="habit-check-btn w-6 h-6 rounded border border-gray-200 dark:border-dark-border flex items-center justify-center text-xs hover:bg-primary-500 hover:text-white transition-colors">三</button>
                                        <button class="habit-check-btn w-6 h-6 rounded border border-gray-200 dark:border-dark-border flex items-center justify-center text-xs hover:bg-primary-500 hover:text-white transition-colors">四</button>
                                        <button class="habit-check-btn w-6 h-6 rounded border border-gray-200 dark:border-dark-border flex items-center justify-center text-xs hover:bg-primary-500 hover:text-white transition-colors">五</button>
                                        <button class="habit-check-btn w-6 h-6 rounded border border-gray-200 dark:border-dark-border flex items-center justify-center text-xs hover:bg-primary-500 hover:text-white transition-colors">六</button>
                                        <button class="habit-check-btn w-6 h-6 rounded border border-gray-200 dark:border-dark-border flex items-center justify-center text-xs hover:bg-primary-500 hover:text-white transition-colors">日</button>
                                    </div>
                                </div>
                            </div>
                            <button id="addHabitBtn" class="mt-4 w-full py-2 text-sm text-primary-500 dark:text-primary-400 hover:bg-primary-50 dark:hover:bg-primary-900/20 rounded-lg transition-colors">+ 添加习惯</button>
                        </div>

                        <div class="bg-white dark:bg-dark-card rounded-2xl border border-gray-100 dark:border-dark-border p-6 shadow-sm">
                            <h2 class="text-lg font-semibold text-gray-800 dark:text-white mb-4">📝 周复盘</h2>
                            <div class="space-y-3">
                                <div><label class="text-xs font-medium text-gray-500 dark:text-gray-400 mb-1 block">本周成就</label><textarea class="w-full h-20 p-3 text-gray-700 dark:text-gray-300 bg-gray-50 dark:bg-dark-bg border border-gray-200 dark:border-dark-border rounded-lg resize-none text-sm input-focus-ring" id="achievements" placeholder="这一周我完成了什么？..."></textarea></div>
                                <div><label class="text-xs font-medium text-gray-500 dark:text-gray-400 mb-1 block">下周计划</label><textarea class="w-full h-20 p-3 text-gray-700 dark:text-gray-300 bg-gray-50 dark:bg-dark-bg border border-gray-200 dark:border-dark-border rounded-lg resize-none text-sm input-focus-ring" id="nextWeek" placeholder="下一周我要做什么？..."></textarea></div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>

            <aside class="w-72 shrink-0 border-l border-gray-100 dark:border-dark-border bg-gray-50/50 dark:bg-dark-bg/50 p-4 overflow-y-auto custom-scrollbar">
                <h2 class="text-sm font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-4">📊 进度概览</h2>
                <div class="bg-white dark:bg-dark-card rounded-xl border border-gray-100 dark:border-dark-border p-4 mb-4">
                    <div class="flex items-center justify-between mb-2"><span class="text-sm text-gray-600 dark:text-gray-300">本周重点</span><span id="flagsProgress" class="text-sm font-semibold text-primary-500">0/3</span></div>
                    <div class="h-2 bg-gray-100 dark:bg-dark-border rounded-full overflow-hidden"><div id="flagsBar" class="h-full bg-primary-500 transition-all duration-300" style="width: 0%"></div></div>
                </div>
                <div class="bg-white dark:bg-dark-card rounded-xl border border-gray-100 dark:border-dark-border p-4 mb-4">
                    <div class="flex items-center justify-between mb-2"><span class="text-sm text-gray-600 dark:text-gray-300">待办清单</span><span id="todosProgress" class="text-sm font-semibold text-primary-500">0/3</span></div>
                    <div class="h-2 bg-gray-100 dark:bg-dark-border rounded-full overflow-hidden"><div id="todosBar" class="h-full bg-primary-500 transition-all duration-300" style="width: 0%"></div></div>
                </div>
                <div class="bg-white dark:bg-dark-card rounded-xl border border-gray-100 dark:border-dark-border p-4 mb-4">
                    <div class="flex items-center justify-between mb-2"><span class="text-sm text-gray-600 dark:text-gray-300">习惯完成率</span><span id="habitsProgress" class="text-sm font-semibold text-primary-500">0%</span></div>
                    <div class="h-2 bg-gray-100 dark:bg-dark-border rounded-full overflow-hidden"><div id="habitsBar" class="h-full bg-primary-500 transition-all duration-300" style="width: 0%"></div></div>
                </div>
                <div class="bg-white dark:bg-dark-card rounded-xl border border-gray-100 dark:border-dark-border p-4">
                    <h3 class="text-sm font-semibold text-gray-800 dark:text-white mb-3">本周重点</h3>
                    <ul id="previewFlags" class="space-y-2 text-sm text-gray-600 dark:text-gray-300"><li class="flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-gray-300"></span> 点击左侧添加</li></ul>
                </div>
                <div class="bg-white dark:bg-dark-card rounded-xl border border-gray-100 dark:border-dark-border p-4 mt-4">
                    <h3 class="text-sm font-semibold text-gray-800 dark:text-white mb-3">阶段目标</h3>
                    <p id="previewGoal" class="text-sm text-gray-600 dark:text-gray-300">点击左侧添加目标</p>
                </div>
            </aside>
        </div>
    </div>

    <div id="toast" class="fixed bottom-6 right-6 px-6 py-3 bg-gray-800 dark:bg-gray-200 text-white dark:text-gray-800 rounded-xl shadow-lg opacity-0 pointer-events-none transition-opacity duration-300 z-50">操作成功</div>

    <div id="pasteModal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-white dark:bg-dark-card rounded-2xl p-6 w-full max-w-md mx-4 shadow-xl">
            <div class="flex items-center justify-between mb-4"><h3 class="text-lg font-semibold text-gray-800 dark:text-white">粘贴文本</h3><button id="closePasteModal" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200">✕</button></div>
            <textarea id="pasteTextArea" class="w-full h-40 p-4 text-gray-700 dark:text-gray-300 bg-gray-50 dark:bg-dark-bg border border-gray-200 dark:border-dark-border rounded-xl resize-none input-focus-ring" placeholder="在此粘贴文本内容..."></textarea>

                <button id="cancelPasteBtn" class="flex-1 py-2 text-sm text-gray-600 dark:text-gray-300 bg-gray-100 dark:bg-dark-border rounded-lg hover:bg-gray-200 dark:hover:bg-dark-card transition-colors">取消</button>

    <script>
        const templates = {
            'optimal-summer': {
                stageGoal: "暑假实现学科查漏补缺，每日学习6小时，每周运动3次，完成2本课外书阅读，每日复盘总结",
                flags: ["完成当日学习计划", "运动30分钟以上", "睡前复盘当日得失"],
                todos: ["整理当日错题本", "背诵20个英语单词", "阅读课外书30分钟"],
                schedule: [
                    { time: "07:00", content: "晨起+早餐+复盘昨日" },
                    { time: "08:00", content: "主科薄弱点专项学习" },
                    { time: "10:15", content: "副科知识点梳理+练习" },
                    { time: "12:00", content: "午餐+午休" },
                    { time: "14:30", content: "技能学习（编程/写作等）" },
                    { time: "16:45", content: "运动/户外活动" },
                    { time: "19:00", content: "课外书阅读+笔记" },
                    { time: "20:45", content: "当日复盘+明日计划" }
                ],
                habits: ["早起", "每日学习", "运动", "阅读", "复盘"]
            }
        };

        let currentDay = 'mon';
        let currentTemplate = null;
        let historyStack = [];
        let historyIndex = -1;
        const MAX_HISTORY = 50;
        let saveTimeout = null;

        const scheduleData = { mon: {}, tue: {}, wed: {}, thu: {}, fri: {}, sat: {}, sun: {} };

        function saveToHistory() {
            const state = {
                stageGoal: document.getElementById('stageGoal').value,
                achievements: document.getElementById('achievements').value,
                nextWeek: document.getElementById('nextWeek').value,
                flags: [], todos: [], habits: [],
                scheduleData: JSON.parse(JSON.stringify(scheduleData)),
                currentDay: currentDay,
                currentTemplate: currentTemplate
            };
            document.querySelectorAll('.flag-item').forEach(item => {
                state.flags.push({
                    text: item.querySelector('input').value,
                    checked: item.querySelector('.check-btn').classList.contains('checked')
                });
            });
            document.querySelectorAll('.todo-item').forEach(item => {
                state.todos.push({
                    text: item.querySelector('input').value,
                    checked: item.querySelector('.check-btn').classList.contains('checked')
                });
            });
            document.querySelectorAll('.habit-item').forEach(item => {
                const days = [];
                item.querySelectorAll('.habit-check-btn').forEach(btn => {
                    days.push(btn.classList.contains('bg-primary-500'));
                });
                state.habits.push({
                    name: item.querySelector('input').value,
                    days: days
                });
            });
            historyStack = historyStack.slice(0, historyIndex + 1);
            historyStack.push(state);
            if (historyStack.length > MAX_HISTORY) {
                historyStack.shift();
            } else {
                historyIndex++;
            }
            updateUndoButton();
            scheduleAutoSave();
        }

        function undo() {
            if (historyIndex > 0) {
                historyIndex--;
                restoreFromHistory(historyStack[historyIndex]);
                showToast('已撤销');
            }
        }

        function restoreFromHistory(state) {
            document.getElementById('stageGoal').value = state.stageGoal;
            document.getElementById('achievements').value = state.achievements;
            document.getElementById('nextWeek').value = state.nextWeek;

            const flagsContainer = document.getElementById('flagsContainer');
            const flagsAddBtn = document.getElementById('addFlagBtn');
            flagsContainer.innerHTML = '';
            state.flags.forEach(flag => {
                const div = document.createElement('div');
                div.className = 'flex items-start gap-3 flag-item';
                div.innerHTML = '<button class="check-btn mt-1 w-5 h-5 rounded-full border-2 border-gray-300 dark:border-gray-600 flex items-center justify-center check-circle ' + (flag.checked ? 'checked' : '') + '"><svg class="w-3 h-3 text-white transition-opacity ' + (flag.checked ? '' : 'opacity-0') + '" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg></button><input type="text" class="flex-1 text-gray-700 dark:text-gray-300 bg-gray-50 dark:bg-dark-bg border border-gray-200 dark:border-dark-border rounded-lg px-3 py-2 text-sm input-focus-ring" value="' + flag.text + '" placeholder="输入重点目标...">';
                flagsContainer.appendChild(div);
                initCheckBtn(div.querySelector('.check-btn'));
                div.querySelector('input').addEventListener('input', updatePreview);
            });
            flagsContainer.appendChild(flagsAddBtn);

            const todosContainer = document.getElementById('todosContainer');
            const todosAddBtn = document.getElementById('addTodoBtn');
            todosContainer.innerHTML = '';
            state.todos.forEach(todo => {
                const div = document.createElement('div');
                div.className = 'flex items-start gap-3 todo-item';
                div.innerHTML = '<button class="check-btn mt-1 w-5 h-5 rounded-full border-2 border-gray-300 dark:border-gray-600 flex items-center justify-center check-circle ' + (todo.checked ? 'checked' : '') + '"><svg class="w-3 h-3 text-white transition-opacity ' + (todo.checked ? '' : 'opacity-0') + '" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg></button><input type="text" class="flex-1 text-gray-700 dark:text-gray-300 bg-gray-50 dark:bg-dark-bg border border-gray-200 dark:border-dark-border rounded-lg px-3 py-2 text-sm input-focus-ring" value="' + todo.text + '" placeholder="输入待办事项...">';
                todosContainer.appendChild(div);
                initCheckBtn(div.querySelector('.check-btn'));
            });
            todosContainer.appendChild(todosAddBtn);

            const habitsContainer = document.getElementById('habitsContainer');
            const habitsAddBtn = document.getElementById('addHabitBtn');
            habitsContainer.innerHTML = '';
            state.habits.forEach(habit => {
                const div = document.createElement('div');
                div.className = 'flex items-center justify-between habit-item';
                let daysHtml = '';
                const dayNames = ['一', '二', '三', '四', '五', '六', '日'];
                habit.days.forEach((checked, idx) => {
                    daysHtml += '<button class="habit-check-btn w-6 h-6 rounded border border-gray-200 dark:border-dark-border flex items-center justify-center text-xs hover:bg-primary-500 hover:text-white transition-colors ' + (checked ? 'bg-primary-500 text-white' : '') + '">' + dayNames[idx] + '</button>';
                });
                div.innerHTML = '<input type="text" class="flex-1 text-gray-700 dark:text-gray-300 bg-gray-50 dark:bg-dark-bg border border-gray-200 dark:border-dark-border rounded-lg px-3 py-2 text-sm input-focus-ring" value="' + habit.name + '" placeholder="习惯名称..."><div class="flex gap-1 ml-3">' + daysHtml + '</div>';
                habitsContainer.appendChild(div);
                div.querySelectorAll('.habit-check-btn').forEach(btn => {
                    btn.addEventListener('click', function() { saveToHistory(); this.classList.toggle('bg-primary-500'); this.classList.toggle('text-white'); updateProgress(); });
                });
            });
            habitsContainer.appendChild(habitsAddBtn);

            Object.keys(scheduleData).forEach(day => {
                scheduleData[day] = JSON.parse(JSON.stringify(state.scheduleData[day]));
            });
            currentDay = state.currentDay;
            currentTemplate = state.currentTemplate;

            document.querySelectorAll('.tab-btn').forEach(btn => {
                if (btn.dataset.day === currentDay) {
                    btn.classList.add('tab-active');
                    btn.classList.remove('text-gray-500', 'dark:text-gray-400');
                } else {
                    btn.classList.remove('tab-active');
                    btn.classList.add('text-gray-500', 'dark:text-gray-400');
                }
            });

            renderSchedule();
            updateProgress();
            updatePreview();
        }

        function updateUndoButton() {
            document.getElementById('undoBtn').disabled = historyIndex <= 0;
        }

        function initSchedule(scheduleItems) {
            saveToHistory();
            Object.keys(scheduleData).forEach(day => { scheduleData[day] = {}; });
            scheduleItems.forEach(item => {
                const time = typeof item === 'string' ? item : item.time;
                const content = typeof item === 'string' ? '' : (item.content || '');
                Object.keys(scheduleData).forEach(day => {
                    scheduleData[day][time] = content;
                });
            });
            renderSchedule();
        }

        function renderSchedule() {
            const tbody = document.getElementById('scheduleBody');
            tbody.innerHTML = '';
            const times = Object.keys(scheduleData[currentDay]).sort();
            times.forEach(time => {
                const row = document.createElement('tr');
                row.className = 'border-b border-gray-100 dark:border-dark-border hover:bg-gray-50 dark:hover:bg-dark-card/50 transition-colors';
                row.innerHTML = '<td class="py-3 px-4 text-sm font-medium text-gray-500 dark:text-gray-400 whitespace-nowrap">' + time + '</td><td class="py-3 px-4"><input type="text" class="schedule-input w-full text-gray-700 dark:text-gray-300 bg-transparent border-b border-gray-200 dark:border-dark-border focus:border-primary-400 dark:focus:border-primary-400 rounded-none px-0 py-1 text-sm input-focus-ring" placeholder="输入安排..." value="' + (scheduleData[currentDay][time] || '') + '" data-time="' + time + '"></td>';
                tbody.appendChild(row);
            });
            document.querySelectorAll('.schedule-input').forEach(input => {
                input.addEventListener('input', function() {
                    saveToHistory();
                    scheduleData[currentDay][this.dataset.time] = this.value;
                });
            });
        }

        function loadTemplate(templateId) {
            saveToHistory();
            currentTemplate = templateId;
            const template = templates[templateId];
            
            document.getElementById('stageGoal').value = template.stageGoal || '';
            document.getElementById('achievements').value = '';
            document.getElementById('nextWeek').value = '';

            const flagsContainer = document.getElementById('flagsContainer');
            const flagsAddBtn = document.getElementById('addFlagBtn');
            flagsContainer.innerHTML = '';
            (template.flags || []).forEach(flagText => {
                const div = document.createElement('div');
                div.className = 'flex items-start gap-3 flag-item';
                div.innerHTML = '<button class="check-btn mt-1 w-5 h-5 rounded-full border-2 border-gray-300 dark:border-gray-600 flex items-center justify-center check-circle"><svg class="w-3 h-3 text-white opacity-0 transition-opacity" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg></button><input type="text" class="flex-1 text-gray-700 dark:text-gray-300 bg-gray-50 dark:bg-dark-bg border border-gray-200 dark:border-dark-border rounded-lg px-3 py-2 text-sm input-focus-ring" value="' + flagText + '" placeholder="输入重点目标...">';
                flagsContainer.appendChild(div);
                initCheckBtn(div.querySelector('.check-btn'));
                div.querySelector('input').addEventListener('input', updatePreview);
            });
            flagsContainer.appendChild(flagsAddBtn);

            const todosContainer = document.getElementById('todosContainer');
            const todosAddBtn = document.getElementById('addTodoBtn');
            todosContainer.innerHTML = '';
            (template.todos || []).forEach(todoText => {
                const div = document.createElement('div');
                div.className = 'flex items-start gap-3 todo-item';
                div.innerHTML = '<button class="check-btn mt-1 w-5 h-5 rounded-full border-2 border-gray-300 dark:border-gray-600 flex items-center justify-center check-circle"><svg class="w-3 h-3 text-white opacity-0 transition-opacity" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg></button><input type="text" class="flex-1 text-gray-700 dark:text-gray-300 bg-gray-50 dark:bg-dark-bg border border-gray-200 dark:border-dark-border rounded-lg px-3 py-2 text-sm input-focus-ring" value="' + todoText + '" placeholder="输入待办事项...">';
                todosContainer.appendChild(div);
                initCheckBtn(div.querySelector('.check-btn'));
            });
            todosContainer.appendChild(todosAddBtn);

            const habitsContainer = document.getElementById('habitsContainer');
            const habitsAddBtn = document.getElementById('addHabitBtn');
            habitsContainer.innerHTML = '';
            (template.habits || []).forEach(habitName => {
                const div = document.createElement('div');
                div.className = 'flex items-center justify-between habit-item';
                div.innerHTML = '<input type="text" class="flex-1 text-gray-700 dark:text-gray-300 bg-gray-50 dark:bg-dark-bg border border-gray-200 dark:border-dark-border rounded-lg px-3 py-2 text-sm input-focus-ring" value="' + habitName + '" placeholder="习惯名称..."><div class="flex gap-1 ml-3"><button class="habit-check-btn w-6 h-6 rounded border border-gray-200 dark:border-dark-border flex items-center justify-center text-xs hover:bg-primary-500 hover:text-white transition-colors">一</button><button class="habit-check-btn w-6 h-6 rounded border border-gray-200 dark:border-dark-border flex items-center justify-center text-xs hover:bg-primary-500 hover:text-white transition-colors">二</button><button class="habit-check-btn w-6 h-6 rounded border border-gray-200 dark:border-dark-border flex items-center justify-center text-xs hover:bg-primary-500 hover:text-white transition-colors">三</button><button class="habit-check-btn w-6 h-6 rounded border border-gray-200 dark:border-dark-border flex items-center justify-center text-xs hover:bg-primary-500 hover:text-white transition-colors">四</button><button class="habit-check-btn w-6 h-6 rounded border border-gray-200 dark:border-dark-border flex items-center justify-center text-xs hover:bg-primary-500 hover:text-white transition-colors">五</button><button class="habit-check-btn w-6 h-6 rounded border border-gray-200 dark:border-dark-border flex items-center justify-center text-xs hover:bg-primary-500 hover:text-white transition-colors">六</button><button class="habit-check-btn w-6 h-6 rounded border border-gray-200 dark:border-dark-border flex items-center justify-center text-xs hover:bg-primary-500 hover:text-white transition-colors">日</button></div>';
                habitsContainer.appendChild(div);
                div.querySelectorAll('.habit-check-btn').forEach(btn => {
                    btn.addEventListener('click', function() { saveToHistory(); this.classList.toggle('bg-primary-500'); this.classList.toggle('text-white'); updateProgress(); });
                });
            });
            habitsContainer.appendChild(habitsAddBtn);

            Object.keys(scheduleData).forEach(day => { scheduleData[day] = {}; });
            initSchedule(template.schedule || []);
            
            updateProgress();
            updatePreview();
            showToast('已加载「高效暑假模板」');
        }

        function getTemplateName(templateId) {
            const names = { 'optimal-summer': '高效暑假模板' };
            return names[templateId] || templateId;
        }

        function updateProgress() {
            const flags = document.querySelectorAll('.flag-item');
            const completedFlags = document.querySelectorAll('.flag-item .check-btn.checked').length;
            document.getElementById('flagsProgress').textContent = completedFlags + '/' + flags.length;
            document.getElementById('flagsBar').style.width = (flags.length > 0 ? (completedFlags / flags.length * 100) : 0) + '%';

            const todos = document.querySelectorAll('.todo-item');
            const completedTodos = document.querySelectorAll('.todo-item .check-btn.checked').length;
            document.getElementById('todosProgress').textContent = completedTodos + '/' + todos.length;
            document.getElementById('todosBar').style.width = (todos.length > 0 ? (completedTodos / todos.length * 100) : 0) + '%';

            const habits = document.querySelectorAll('.habit-item');
            let totalHabitChecks = 0, completedHabitChecks = 0;
            habits.forEach(item => {
                const checks = item.querySelectorAll('.habit-check-btn');
                totalHabitChecks += checks.length;
                completedHabitChecks += item.querySelectorAll('.habit-check-btn.bg-primary-500').length;
            });
            const habitsPercent = totalHabitChecks > 0 ? Math.round((completedHabitChecks / totalHabitChecks) * 100) : 0;
            document.getElementById('habitsProgress').textContent = habitsPercent + '%';
            document.getElementById('habitsBar').style.width = habitsPercent + '%';
        }

        function updatePreview() {
            const flagsList = document.getElementById('previewFlags');
            const flagInputs = document.querySelectorAll('.flag-item input');
            flagsList.innerHTML = '';
            flagInputs.forEach(input => {
                const value = input.value.trim();
                if (value) {
                    const li = document.createElement('li');
                    li.className = 'flex items-center gap-2';
                    li.innerHTML = '<span class="w-2 h-2 rounded-full bg-primary-500"></span> ' + value;
                    flagsList.appendChild(li);
                }
            });
            if (flagsList.children.length === 0) {
                flagsList.innerHTML = '<li class="flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-gray-300"></span> 点击左侧添加</li>';
            }
            const goal = document.getElementById('stageGoal').value.trim();
            document.getElementById('previewGoal').textContent = goal || '点击左侧添加目标';
        }

        function addFlag() {
            saveToHistory();
            const container = document.getElementById('flagsContainer');
            const div = document.createElement('div');
            div.className = 'flex items-start gap-3 flag-item fade-in';
            div.innerHTML = '<button class="check-btn mt-1 w-5 h-5 rounded-full border-2 border-gray-300 dark:border-gray-600 flex items-center justify-center check-circle"><svg class="w-3 h-3 text-white opacity-0 transition-opacity" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg></button><input type="text" class="flex-1 text-gray-700 dark:text-gray-300 bg-gray-50 dark:bg-dark-bg border border-gray-200 dark:border-dark-border rounded-lg px-3 py-2 text-sm input-focus-ring" placeholder="输入重点目标...">';
            container.insertBefore(div, document.getElementById('addFlagBtn'));
            initCheckBtn(div.querySelector('.check-btn'));
            div.querySelector('input').addEventListener('input', updatePreview);
            div.querySelector('input').focus();
        }

        function addTodo() {
            saveToHistory();
            const container = document.getElementById('todosContainer');
            const div = document.createElement('div');
            div.className = 'flex items-start gap-3 todo-item fade-in';
            div.innerHTML = '<button class="check-btn mt-1 w-5 h-5 rounded-full border-2 border-gray-300 dark:border-gray-600 flex items-center justify-center check-circle"><svg class="w-3 h-3 text-white opacity-0 transition-opacity" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg></button><input type="text" class="flex-1 text-gray-700 dark:text-gray-300 bg-gray-50 dark:bg-dark-bg border border-gray-200 dark:border-dark-border rounded-lg px-3 py-2 text-sm input-focus-ring" placeholder="输入待办事项...">';
            container.insertBefore(div, document.getElementById('addTodoBtn'));
            initCheckBtn(div.querySelector('.check-btn'));
            div.querySelector('input').focus();
        }

        function addHabit() {
            saveToHistory();
            const container = document.getElementById('habitsContainer');
            const div = document.createElement('div');
            div.className = 'flex items-center justify-between habit-item fade-in';
            div.innerHTML = '<input type="text" class="flex-1 text-gray-700 dark:text-gray-300 bg-gray-50 dark:bg-dark-bg border border-gray-200 dark:border-dark-border rounded-lg px-3 py-2 text-sm input-focus-ring" placeholder="习惯名称..."><div class="flex gap-1 ml-3"><button class="habit-check-btn w-6 h-6 rounded border border-gray-200 dark:border-dark-border flex items-center justify-center text-xs hover:bg-primary-500 hover:text-white transition-colors">一</button><button class="habit-check-btn w-6 h-6 rounded border border-gray-200 dark:border-dark-border flex items-center justify-center text-xs hover:bg-primary-500 hover:text-white transition-colors">二</button><button class="habit-check-btn w-6 h-6 rounded border border-gray-200 dark:border-dark-border flex items-center justify-center text-xs hover:bg-primary-500 hover:text-white transition-colors">三</button><button class="habit-check-btn w-6 h-6 rounded border border-gray-200 dark:border-dark-border flex items-center justify-center text-xs hover:bg-primary-500 hover:text-white transition-colors">四</button><button class="habit-check-btn w-6 h-6 rounded border border-gray-200 dark:border-dark-border flex items-center justify-center text-xs hover:bg-primary-500 hover:text-white transition-colors">五</button><button class="habit-check-btn w-6 h-6 rounded border border-gray-200 dark:border-dark-border flex items-center justify-center text-xs hover:bg-primary-500 hover:text-white transition-colors">六</button><button class="habit-check-btn w-6 h-6 rounded border border-gray-200 dark:border-dark-border flex items-center justify-center text-xs hover:bg-primary-500 hover:text-white transition-colors">日</button></div>';
            container.appendChild(div);
            div.querySelectorAll('.habit-check-btn').forEach(btn => {
                btn.addEventListener('click', function() { saveToHistory(); this.classList.toggle('bg-primary-500'); this.classList.toggle('text-white'); updateProgress(); });
            });
            div.querySelector('input').focus();
        }

        function addTimeSlot() {
            saveToHistory();
            const tbody = document.getElementById('scheduleBody');
            const row = document.createElement('tr');
            row.className = 'border-b border-gray-100 dark:border-dark-border hover:bg-gray-50 dark:hover:bg-dark-card/50 transition-colors fade-in';
            row.innerHTML = '<td class="py-3 px-4"><input type="text" class="w-20 text-gray-700 dark:text-gray-300 bg-transparent border-b border-gray-200 dark:border-dark-border focus:border-primary-400 dark:focus:border-primary-400 rounded-none px-0 py-1 text-sm font-medium text-gray-500 dark:text-gray-400 input-focus-ring" placeholder="时间" data-time-input></td><td class="py-3 px-4"><input type="text" class="schedule-input w-full text-gray-700 dark:text-gray-300 bg-transparent border-b border-gray-200 dark:border-dark-border focus:border-primary-400 dark:focus:border-primary-400 rounded-none px-0 py-1 text-sm input-focus-ring" placeholder="输入安排..." data-time-new></td>';
            tbody.appendChild(row);
            const timeInput = row.querySelector('[data-time-input]');
            const scheduleInput = row.querySelector('[data-time-new]');
            timeInput.addEventListener('change', function() {
                const time = this.value;
                if (time) {
                    this.setAttribute('data-time', time);
                    scheduleInput.setAttribute('data-time', time);
                    Object.keys(scheduleData).forEach(day => {
                        if (!scheduleData[day][time]) {
                            scheduleData[day][time] = '';
                        }
                    });
                    scheduleInput.value = scheduleData[currentDay][time];
                }
            });
            scheduleInput.addEventListener('input', function() {
                const time = this.dataset.time;
                if (time) {
                    scheduleData[currentDay][time] = this.value;
                }
            });
            timeInput.focus();
        }

        function initCheckBtn(btn) {
            btn.addEventListener('click', function() {
                saveToHistory();
                this.classList.toggle('checked');
                this.querySelector('svg').classList.toggle('opacity-0');
                updateProgress();
            });
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.remove('opacity-0');
            setTimeout(() => {
                toast.classList.add('opacity-0');
            }, 2000);
        }

        function exportExcel() {
            const wb = XLSX.utils.book_new();
            const stageGoal = document.getElementById('stageGoal').value;
            const achievements = document.getElementById('achievements').value;
            const nextWeek = document.getElementById('nextWeek').value;
            const flags = [];
            document.querySelectorAll('.flag-item').forEach(item => {
                flags.push({ text: item.querySelector('input').value, checked: item.querySelector('.check-btn').classList.contains('checked') });
            });
            const todos = [];
            document.querySelectorAll('.todo-item').forEach(item => {
                todos.push({ text: item.querySelector('input').value, checked: item.querySelector('.check-btn').classList.contains('checked') });
            });

        function parseExcelFile(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                        const jsonData = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });
                        const result = parseTableData(jsonData);
                        resolve(result);
                    } catch (error) {
                        reject(error);
                    }
                };
                reader.onerror = reject;
                reader.readAsArrayBuffer(file);
            });
        }

        function parseWordFile(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    mammoth.extractRawText({ arrayBuffer: e.target.result })
                        .then(function(result) {
                            const text = result.value;
                            const parsed = parseTextContent(text);
                            resolve(parsed);
                        })
                        .catch(reject);
                };
                reader.onerror = reject;
                reader.readAsArrayBuffer(file);
            });
        }

        function parseTextFile(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const text = e.target.result;
                    const parsed = parseTextContent(text);
                    resolve(parsed);
                };
                reader.onerror = reject;
                reader.readAsText(file, 'utf-8');
            });
        }

        function parseCsvFile(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const text = e.target.result;
                    const rows = text.split('\n').map(row => {
                        const result = [];
                        let current = '';
                        let inQuote = false;
                        for (let i = 0; i < row.length; i++) {
                            const char = row[i];
                            if (char === '"' && (i === 0 || row[i-1] !== '\\')) {
                                inQuote = !inQuote;
                            } else if (char === ',' && !inQuote) {
                                result.push(current);
                                current = '';
                            } else {
                                current += char;
                            }
                        }
                        result.push(current);
                        return result;
                    });
                    const result = parseTableData(rows);
                    resolve(result);
                };
                reader.onerror = reject;
                reader.readAsText(file, 'utf-8');
            });
        }

        function parseJsonFile(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const data = JSON.parse(e.target.result);
                        const result = {
                            goal: data.stageGoal || data.goal || '',
                            achievements: data.achievements || '',
                            nextWeek: data.nextWeek || '',
                            flags: data.flags || [],
                            todos: data.todos || [],
                            habits: data.habits || [],
                            schedule: {}
                        };
                        if (data.scheduleData) {
                            Object.keys(data.scheduleData).forEach(day => {
                                Object.keys(data.scheduleData[day]).forEach(time => {
                                    if (!result.schedule[time]) result.schedule[time] = '';
                                });
                            });
                        }
                        resolve(result);
                    } catch (error) {
                        reject(error);
                    }
                };
                reader.onerror = reject;
                reader.readAsText(file, 'utf-8');
            });
        }

        function parseTableData(data) {
            const result = { flags: [], todos: [], habits: [], schedule: {}, goal: '', achievements: '', nextWeek: '' };
            let currentSection = '';

            const goalKeywords = ['目标', 'goal', 'Goal', '目的', '计划目标', '总目标'];
            const flagKeywords = ['重点', 'flag', 'Flag', '主要任务', '核心任务'];
            const todoKeywords = ['待办', 'todo', 'Todo', '任务', '清单', '事项'];
            const habitKeywords = ['习惯', 'habit', 'Habit', '日常', '打卡'];
            const scheduleKeywords = ['时间', 'time', 'Time', '日程', '安排'];
            const achievementKeywords = ['成就', 'achievement', '总结', '成果'];
            const nextWeekKeywords = ['下周', 'next', 'Next', '未来'];

            for (let i = 0; i < data.length; i++) {
                const row = data[i];
                if (!row || row.length === 0) continue;

                const firstCell = String(row[0] || '').trim().toLowerCase();
                const originalFirstCell = String(row[0] || '').trim();

                if (goalKeywords.some(k => originalFirstCell.includes(k))) {
                    result.goal = String(row[row.length - 1] || row[1] || '').trim();
                } else if (flagKeywords.some(k => firstCell.includes(k))) {
                    currentSection = 'flags';
                } else if (todoKeywords.some(k => firstCell.includes(k))) {
                    currentSection = 'todos';
                } else if (habitKeywords.some(k => firstCell.includes(k))) {
                    currentSection = 'habits';
                } else if (scheduleKeywords.some(k => firstCell.includes(k))) {
                    currentSection = 'schedule';
                } else if (achievementKeywords.some(k => firstCell.includes(k))) {
                    result.achievements = String(row[row.length - 1] || row[1] || '').trim();
                } else if (nextWeekKeywords.some(k => firstCell.includes(k))) {
                    result.nextWeek = String(row[row.length - 1] || row[1] || '').trim();
                } else if (currentSection === 'flags' && originalFirstCell && !originalFirstCell.startsWith('-') && !/^\d+$/.test(originalFirstCell)) {
                    result.flags.push({ text: originalFirstCell, checked: false });
                } else if (currentSection === 'todos' && originalFirstCell && !originalFirstCell.startsWith('-') && !/^\d+$/.test(originalFirstCell)) {
                    result.todos.push({ text: originalFirstCell, checked: false });
                } else if (currentSection === 'habits' && originalFirstCell) {
                    result.habits.push({ name: originalFirstCell, days: [false, false, false, false, false, false, false] });
                } else if (currentSection === 'schedule' && /^\d{1,2}:\d{2}$/.test(originalFirstCell)) {
                    result.schedule[originalFirstCell] = row[1] ? String(row[1]).trim() : '';
                } else if (/^\d{1,2}:\d{2}/.test(originalFirstCell)) {
                    const timeMatch = originalFirstCell.match(/^\d{1,2}:\d{2}/);
                    if (timeMatch) {
                        result.schedule[timeMatch[0]] = originalFirstCell.replace(timeMatch[0], '').trim() || (row[1] ? String(row[1]).trim() : '');
                    }
                } else if (originalFirstCell && !currentSection && !/^[\d\.\-*+]$/.test(originalFirstCell)) {
                    if (result.flags.length < 5) {
                        result.flags.push({ text: originalFirstCell, checked: false });
                    } else if (result.todos.length < 5) {
                        result.todos.push({ text: originalFirstCell, checked: false });
                    }
                }
            }

            return result;
        }

        function parseTextContent(text) {
            const result = { flags: [], todos: [], habits: [], schedule: {}, goal: '', achievements: '', nextWeek: '' };
            const lines = text.split('\n');
            let currentSection = '';

            const goalKeywords = ['目标', 'goal', 'Goal', '目的', '计划目标'];
            const flagKeywords = ['重点', 'flag', 'Flag', '主要任务'];
            const todoKeywords = ['待办', 'todo', 'Todo', '任务', '清单'];
            const habitKeywords = ['习惯', 'habit', 'Habit', '日常'];
            const scheduleKeywords = ['时间', 'time', 'Time', '日程'];
            const achievementKeywords = ['成就', 'achievement', '总结'];
            const nextWeekKeywords = ['下周', 'next', 'Next'];

            lines.forEach(line => {
                line = line.trim();
                if (!line) return;

                if (goalKeywords.some(k => line.includes(k))) {
                    result.goal = line.replace(/^.*[目标目的]\s*[：:]\s*/, '').replace(/^[目标【】\s]+/, '');
                } else if (flagKeywords.some(k => line.includes(k))) {
                    currentSection = 'flags';
                } else if (todoKeywords.some(k => line.includes(k))) {
                    currentSection = 'todos';
                } else if (habitKeywords.some(k => line.includes(k))) {
                    currentSection = 'habits';
                } else if (scheduleKeywords.some(k => line.includes(k))) {
                    currentSection = 'schedule';
                } else if (achievementKeywords.some(k => line.includes(k))) {
                    result.achievements = line.replace(/^.*[成就总结]\s*[：:]\s*/, '');
                } else if (nextWeekKeywords.some(k => line.includes(k))) {
                    result.nextWeek = line.replace(/^.*[下周]\s*[：:]\s*/, '');
                } else if (line.match(/^[\d\.\-*+•]\s+/)) {
                    const content = line.replace(/^[\d\.\-*+•]\s+/, '');
                    if (currentSection === 'flags') {
                        result.flags.push({ text: content, checked: false });
                    } else if (currentSection === 'todos') {
                        result.todos.push({ text: content, checked: false });
                    } else if (currentSection === 'habits') {
                        result.habits.push({ name: content, days: [false, false, false, false, false, false, false] });
                    } else if (!currentSection) {
                        if (result.flags.length < 5) {
                            result.flags.push({ text: content, checked: false });
                        } else {
                            result.todos.push({ text: content, checked: false });
                        }
                    }
                } else if (line.match(/^\d{1,2}:\d{2}/)) {
                    const timeMatch = line.match(/^\d{1,2}:\d{2}/);
                    if (timeMatch) {
                        result.schedule[timeMatch[0]] = line.replace(timeMatch[0], '').trim();
                    }
                } else if (line.match(/^[周一二三四五六日]\s*[：:]/)) {
                    currentSection = 'schedule';
                } else if (!currentSection && line.length > 2 && line.length < 50) {
                    if (result.flags.length < 5) {
                        result.flags.push({ text: line, checked: false });
                    }
                }
            });

            return result;
        }

        async function handleFileImport(file) {
            try {
                showToast('正在解析文件...');
                let data;

                if (file.name.endsWith('.xlsx') || file.name.endsWith('.xls')) {
                    data = await parseExcelFile(file);
                } else if (file.name.endsWith('.docx')) {
                    data = await parseWordFile(file);
                } else if (file.name.endsWith('.csv')) {
                    data = await parseCsvFile(file);
                } else if (file.name.endsWith('.txt')) {
                    data = await parseTextFile(file);
                } else if (file.name.endsWith('.json')) {
                    data = await parseJsonFile(file);
                } else {
                    showToast('不支持的文件格式');
                    return;
                }

                applyImportedData(data);
            } catch (error) {
                console.error('导入失败:', error);
                showToast('导入失败，请检查文件格式');
            }
        }

        function initEventListeners() {
            document.querySelectorAll('.template-btn').forEach(btn => {
                btn.addEventListener('click', function() { loadTemplate(this.dataset.template); });
            });

            document.getElementById('addFlagBtn').addEventListener('click', addFlag);
            document.getElementById('addTodoBtn').addEventListener('click', addTodo);
            document.getElementById('addHabitBtn').addEventListener('click', addHabit);
            document.getElementById('addTimeSlotBtn').addEventListener('click', addTimeSlot);

            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.tab-btn').forEach(b => { b.classList.remove('tab-active'); b.classList.add('text-gray-500', 'dark:text-gray-400'); });
                    this.classList.add('tab-active');
                    this.classList.remove('text-gray-500', 'dark:text-gray-400');
                    currentDay = this.dataset.day;
                    renderSchedule();
                });
            });

            document.getElementById('undoBtn').addEventListener('click', undo);
            document.getElementById('copyBtn').addEventListener('click', copyPlan);
            document.getElementById('exportBtn').addEventListener('click', exportExcel);
            document.getElementById('exportJsonBtn').addEventListener('click', exportJson);
            document.getElementById('themeBtn').addEventListener('click', toggleTheme);
            document.getElementById('clearBtn').addEventListener('click', clearAll);
            document.getElementById('loadSampleBtn').addEventListener('click', loadSampleData);

            document.getElementById('stageGoal').addEventListener('input', function() { saveToHistory(); updatePreview(); });
            document.getElementById('achievements').addEventListener('input', saveToHistory);
            document.getElementById('nextWeek').addEventListener('input', saveToHistory);

            document.getElementById('dropZone').addEventListener('click', function() {
                document.getElementById('importFile').click();
            });

            document.getElementById('selectFileBtn').addEventListener('click', function() {
                document.getElementById('importFile').click();
            });

            document.getElementById('importFile').addEventListener('change', function(e) {
                if (e.target.files[0]) {
                    handleFileImport(e.target.files[0]);
                }
            });

            document.getElementById('dropZone').addEventListener('dragover', function(e) {
                e.preventDefault();
                this.classList.add('drag-over');
            });

            document.getElementById('dropZone').addEventListener('dragleave', function(e) {
                e.preventDefault();
                this.classList.remove('drag-over');
            });

            document.getElementById('dropZone').addEventListener('drop', function(e) {
                e.preventDefault();
                this.classList.remove('drag-over');
                if (e.dataTransfer.files[0]) {
                    handleFileImport(e.dataTransfer.files[0]);
                }
            });

            document.getElementById('pasteTextBtn').addEventListener('click', function() {
                document.getElementById('pasteModal').classList.remove('opacity-0', 'pointer-events-none');
            });

            document.getElementById('closePasteModal').addEventListener('click', function() {
                document.getElementById('pasteModal').classList.add('opacity-0', 'pointer-events-none');
            });

            document.getElementById('cancelPasteBtn').addEventListener('click', function() {
                document.getElementById('pasteModal').classList.add('opacity-0', 'pointer-events-none');
            });

            document.getElementById('confirmPasteBtn').addEventListener('click', function() {
                const text = document.getElementById('pasteTextArea').value;
                if (text.trim()) {
                    const data = parseTextContent(text);
                    applyImportedData(data);
                }
                document.getElementById('pasteModal').classList.add('opacity-0', 'pointer-events-none');
                document.getElementById('pasteTextArea').value = '';
            });

            document.addEventListener('keydown', function(e) {
                if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
                    e.preventDefault();
                    undo();
                }
            });

            renderSchedule();
            updateProgress();
            updatePreview();
            loadTheme();
            loadFromStorage();
        }

        initEventListeners();
    </script>
